    // ==========================================
    // COMPONENT: Treasurer Dashboard
    // ==========================================
    function TreasurerDashboard({ session, onLogout, onNotify, onOpenPortal }) {
      const [activeTab, setActiveTab] = useState('overview'); // overview, students, selections, pending, analytics, reports, settings, audit
      const [sidebarOpen, setSidebarOpen] = useState(false);
      
      const [stats, setStats] = useState(null);
      const [studentRecords, setStudentRecords] = useState([]);
      const [pendingStudents, setPendingStudents] = useState([]);
      const [auditLogs, setAuditLogs] = useState([]);
      const [portalSettings, setPortalSettings] = useState(null);
      
      const [isLoading, setIsLoading] = useState(false);
      const [isStatsLoading, setIsStatsLoading] = useState(false);

      // Filters
      const [searchQuery, setSearchQuery] = useState('');
      const [filterColour, setFilterColour] = useState('ALL');
      const [filterSize, setFilterSize] = useState('ALL');
      const [filterStatus, setFilterStatus] = useState('ALL');

      // Modals
      const [showAddStudentModal, setShowAddStudentModal] = useState(false);
      const [correctModalStudent, setCorrectModalStudent] = useState(null);
      const [handoutConfirmStudent, setHandoutConfirmStudent] = useState(null);
      const [showPasswordChangeModal, setShowPasswordChangeModal] = useState(session && session.mustChangePassword);
      const [reportPreview, setReportPreview] = useState(null);

      // Fetch Dashboard Stats
      const loadStats = async () => {
        setIsStatsLoading(true);
        try {
          const res = await ApiService.call('getDashboardStats', session.sessionToken);
          setStats(res);
        } catch (err) {
          onNotify({ message: 'Error loading dashboard statistics: ' + err.message, type: 'error' });
        } finally {
          setIsStatsLoading(false);
        }
      };

      // Fetch Student Records
      const loadStudentRecords = async () => {
        setIsLoading(true);
        try {
          const res = await ApiService.call('getStudentSelections', session.sessionToken, {
            search: searchQuery,
            colour: filterColour,
            size: filterSize,
            status: filterStatus
          });
          setStudentRecords(res);
        } catch (err) {
          onNotify({ message: 'Error loading student records: ' + err.message, type: 'error' });
        } finally {
          setIsLoading(false);
        }
      };

      // Fetch Pending Students
      const loadPendingStudents = async () => {
        setIsLoading(true);
        try {
          const res = await ApiService.call('getPendingStudents', session.sessionToken);
          setPendingStudents(res);
        } catch (err) {
          onNotify({ message: 'Error loading pending students: ' + err.message, type: 'error' });
        } finally {
          setIsLoading(false);
        }
      };

      // Fetch Audit Logs
      const loadAuditLogs = async () => {
        setIsLoading(true);
        try {
          const res = await ApiService.call('getAuditLogs', session.sessionToken);
          setAuditLogs(res);
        } catch (err) {
          onNotify({ message: 'Error loading audit logs: ' + err.message, type: 'error' });
        } finally {
          setIsLoading(false);
        }
      };

      // Fetch Settings
      const loadSettings = async () => {
        try {
          const res = await ApiService.call('getPortalSettings');
          setPortalSettings(res);
        } catch (err) {
          console.error(err);
        }
      };

      // Initial Data Loading
      useEffect(() => {
        loadStats();
        loadSettings();
      }, []);

      // Tab switch & live filter effect
      useEffect(() => {
        if (activeTab === 'students' || activeTab === 'selections') {
          loadStudentRecords();
        } else if (activeTab === 'pending') {
          loadPendingStudents();
        } else if (activeTab === 'audit') {
          loadAuditLogs();
        } else if (activeTab === 'overview' || activeTab === 'analytics') {
          loadStats();
        }
      }, [activeTab, searchQuery, filterColour, filterSize, filterStatus]);

      // Toggle Submissions Open / Closed
      const handleToggleSubmissions = async () => {
        const newStatus = (stats?.overview?.submissionStatus === 'OPEN') ? 'CLOSED' : 'OPEN';
        try {
          const res = await ApiService.call('setSubmissionStatus', session.sessionToken, newStatus);
          if (res.success) {
            onNotify({ message: `Submissions are now ${newStatus}!`, type: 'success' });
            loadStats();
            loadSettings();
          }
        } catch (err) {
          onNotify({ message: 'Failed to update submission status: ' + err.message, type: 'error' });
        }
      };

      // Reset / Delete Submission
      const handleResetSubmission = async (indexNumber) => {
        if (!confirm(`Are you sure you want to reset the submission for student ${indexNumber}? They will be able to submit again.`)) return;

        try {
          const res = await ApiService.call('deleteStudentSelection', session.sessionToken, indexNumber, 'Treasurer Reset Action');
          if (res.success) {
            onNotify({ message: 'Submission reset successfully.', type: 'success' });
            loadStudentRecords();
            loadStats();
          }
        } catch (err) {
          onNotify({ message: 'Failed to reset submission: ' + err.message, type: 'error' });
        }
      };

      // Tick / Untick Shirt Given Out (Collected Status)
      const handleToggleCollection = async (indexNumber) => {
        try {
          const res = await ApiService.call('toggleCollectionStatus', session.sessionToken, indexNumber);
          if (res.success) {
            const isGiven = res.collectionStatus === 'Collected';
            onNotify({
              message: isGiven ? `Marked ${indexNumber} as Given Out!` : `Undid Given Out for ${indexNumber}.`,
              type: isGiven ? 'success' : 'info'
            });
            setHandoutConfirmStudent(null);
            loadStudentRecords();
            loadStats();
          }
        } catch (err) {
          onNotify({ message: err.message || 'Could not update handout status.', type: 'error' });
        }
      };

      // Remove Student from Register
      const handleDeleteStudent = async (indexNumber, fullName) => {
        if (!confirm(`Remove ${fullName} (${indexNumber}) from the pre-order register?`)) return;
        try {
          const res = await ApiService.call('deletePaidStudent', session.sessionToken, indexNumber);
          if (res.success) {
            onNotify({ message: `Removed ${fullName} from register.`, type: 'info' });
            loadStudentRecords();
            loadStats();
          }
        } catch (err) {
          onNotify({ message: err.message || 'Could not remove student.', type: 'error' });
        }
      };

      // Copy Pending Students List formatted for Class WhatsApp Group
      const handleCopyPendingWhatsApp = () => {
        if (!pendingStudents || pendingStudents.length === 0) {
          onNotify({ message: 'No pending students to copy.', type: 'info' });
          return;
        }
        const lines = [
          '*ITSU LACOSTE SELECTION REMINDER*',
          'The following pre-ordered students have not yet selected their Lacoste *Colour* and *Size* on the portal:',
          ''
        ];
        pendingStudents.forEach((st, i) => {
          lines.push(`${i + 1}. ${String(st.fullName || '').toUpperCase()} (${st.indexNumber})`);
        });
        lines.push('', 'Kindly visit the ITSU Lacoste Portal and submit your preference immediately.');
        navigator.clipboard.writeText(lines.join('\n'))
          .then(() => onNotify({ message: `Copied ${pendingStudents.length} pending student(s) for WhatsApp!`, type: 'success' }))
          .catch(() => onNotify({ message: 'Could not copy to clipboard.', type: 'error' }));
      };

      // Helper to generate file downloads (CSV, Excel XML, Docx, PDF)
      const downloadFile = (filename, content, mimeType) => {
        const blob = new Blob([content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      // Helper: Download True Binary .xlsx Workbook via SheetJS (or .xls fallback)
      const downloadTrueExcel = (rep, safeTitle, dateSlug) => {
        if (window.XLSX) {
          const aoa = [
            [rep.institution + ' - ' + rep.department],
            [rep.title],
            ['Generated: ' + rep.generatedAt + ' | Authorized Treasurer: ' + rep.generatedBy],
            []
          ];
          if (rep.summary && Object.keys(rep.summary).length > 0) {
            aoa.push(['EXECUTIVE SUMMARY']);
            Object.entries(rep.summary).forEach(([k, v]) => aoa.push([k, String(v)]));
            aoa.push([]);
          }
          aoa.push(rep.headers);
          rep.rows.forEach(r => aoa.push(r.map(c => String(c ?? ''))));

          const ws = window.XLSX.utils.aoa_to_sheet(aoa);
          ws['!cols'] = rep.headers.map((h, i) => {
            const maxLen = Math.max(
              String(h).length,
              ...rep.rows.map(r => String(r[i] ?? '').length),
              12
            );
            return { wch: Math.min(maxLen + 4, 42) };
          });
          const wb = window.XLSX.utils.book_new();
          window.XLSX.utils.book_append_sheet(wb, ws, 'ITSU_Report');
          window.XLSX.writeFile(wb, `${safeTitle}_${dateSlug}.xlsx`);
          onNotify({ message: 'Excel (.xlsx) file downloaded!', type: 'success' });
        } else {
          downloadViewableHtml(rep, 'xlsx', safeTitle, dateSlug);
        }
      };

      // Helper: Download Word (.doc) Document
      const downloadTrueWord = (rep, safeTitle, dateSlug) => {
        const docContent = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
<head><meta charset="utf-8"><title>${rep.title}</title>
<style>
  body { font-family: Calibri, Arial, sans-serif; font-size: 11pt; color: #1e293b; }
  h1 { font-size: 16pt; color: #1e3a8a; margin-bottom: 2px; }
  h2 { font-size: 12pt; color: #0f172a; margin-top: 0; }
  .meta { font-size: 9pt; color: #64748b; margin-bottom: 18px; }
  table { border-collapse: collapse; width: 100%; margin-top: 14px; }
  th { background-color: #1e3a8a; color: white; border: 1px solid #1e3a8a; padding: 6px 10px; text-align: left; font-size: 10pt; }
  td { border: 1px solid #cbd5e1; padding: 6px 10px; font-size: 10pt; }
  tr:nth-child(even) { background-color: #f8fafc; }
  .summary-box { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 10px; margin-bottom: 15px; }
</style>
</head>
<body>
  <h1>${rep.institution}</h1>
  <h2>${rep.department} • ${rep.union}</h2>
  <h3>${rep.title}</h3>
  <div class="meta">Generated: ${rep.generatedAt} | Authorized Treasurer: ${rep.generatedBy}</div>
  <div class="summary-box">
    <strong>Executive Summary:</strong><br/>
    ${Object.entries(rep.summary || {}).map(([k, v]) => `• <b>${k}:</b> ${v}<br/>`).join('')}
  </div>
  <table>
    <thead>
      <tr>${rep.headers.map(h => `<th>${h}</th>`).join('')}</tr>
    </thead>
    <tbody>
      ${rep.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}
    </tbody>
  </table>
</body>
</html>`;
        downloadFile(`${safeTitle}_${dateSlug}.doc`, '\uFEFF' + docContent, 'application/msword;charset=utf-8');
        onNotify({ message: 'Word (.doc) document downloaded!', type: 'success' });
      };

      // Helper: Download Self-Contained Browser-Viewable File (.html) that opens in Chrome/Edge without MS Office
      const downloadViewableHtml = (rep, mode, safeTitle, dateSlug) => {
        const isExcel = mode === 'xlsx';
        const themeColor = isExcel ? '#107C41' : '#185ABD';
        const modeLabel = isExcel ? 'Excel Spreadsheet View' : 'Word Document View';
        const htmlDoc = `<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>${rep.title} - ${modeLabel}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', Calibri, Arial, sans-serif; background: ${isExcel ? '#f1f5f9' : '#e2e8f0'}; color: #0f172a; }
    .topbar { background: ${themeColor}; color: white; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    .topbar-title { font-weight: 700; font-size: 14px; letter-spacing: 0.02em; }
    .topbar-sub { font-size: 11px; opacity: 0.85; }
    .btn-print { background: white; color: ${themeColor}; border: none; padding: 7px 16px; border-radius: 6px; font-weight: 700; font-size: 12px; cursor: pointer; }
    .container { max-width: ${isExcel ? '1200px' : '860px'}; margin: 24px auto; background: white; padding: ${isExcel ? '24px' : '48px 56px'}; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { margin: 0; font-size: 20px; color: #0f172a; text-transform: uppercase; }
    h2 { margin: 4px 0 0; font-size: 13px; color: #475569; font-weight: 600; }
    .rep-title { font-size: 16px; font-weight: 700; color: ${themeColor}; margin-top: 14px; }
    .meta { font-size: 11px; color: #64748b; margin-top: 4px; padding-bottom: 14px; border-bottom: 2px solid ${themeColor}; }
    .summary { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; }
    .summary-item { background: #f8fafc; border: 1px solid #cbd5e1; border-left: 3px solid ${themeColor}; padding: 8px 12px; border-radius: 4px; font-size: 12px; }
    .summary-item span { display: block; font-size: 10px; color: #64748b; text-transform: uppercase; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 12px; }
    th { background: ${themeColor}; color: white; text-align: left; padding: 9px 12px; border: 1px solid #cbd5e1; font-weight: 600; }
    td { padding: 8px 12px; border: 1px solid #cbd5e1; }
    tr:nth-child(even) td { background: #f8fafc; }
    @media print { .topbar { display: none; } body { background: white; } .container { box-shadow: none; margin: 0; padding: 0; max-width: 100%; } }
  </style>
</head>
<body>
  <div class="topbar">
    <div>
      <div class="topbar-title">${rep.title} (${modeLabel})</div>
      <div class="topbar-sub">${rep.institution} • ${rep.department}</div>
    </div>
    <button class="btn-print" onclick="window.print()">Print / Save as PDF</button>
  </div>
  <div class="container">
    <h1>${rep.institution}</h1>
    <h2>${rep.department} • ${rep.union}</h2>
    <div class="rep-title">${rep.title}</div>
    <div class="meta">Generated: ${rep.generatedAt} | Authorized Treasurer: ${rep.generatedBy}</div>
    <div class="summary">
      ${Object.entries(rep.summary || {}).map(([k, v]) => `<div class="summary-item"><span>${k}</span><strong>${v}</strong></div>`).join('')}
    </div>
    <table>
      <thead>
        <tr>${rep.headers.map(h => `<th>${h}</th>`).join('')}</tr>
      </thead>
      <tbody>
        ${rep.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}
      </tbody>
    </table>
  </div>
</body>
</html>`;
        downloadFile(`${safeTitle}_${modeLabel.replace(/\s+/g, '_')}_${dateSlug}.html`, htmlDoc, 'text/html;charset=utf-8');
        onNotify({ message: 'Browser-viewable report downloaded! Click it in Downloads to view in Chrome.', type: 'success' });
      };

      // Helper: Open Printable PDF View
      const openPrintPdf = (rep) => {
        const printWin = window.open('', '_blank');
        if (!printWin) {
          onNotify({ message: 'Please allow popups to open the PDF print view.', type: 'error' });
          return;
        }
        printWin.document.write(`
          <html>
          <head>
            <title>${rep.title} - ITSU</title>
            <style>
              body { font-family: 'Inter', Arial, sans-serif; padding: 30px; color: #0f172a; }
              .header { border-bottom: 2px solid #1e3a8a; padding-bottom: 15px; margin-bottom: 20px; }
              h1 { margin: 0; font-size: 20px; color: #1e3a8a; text-transform: uppercase; }
              h2 { margin: 4px 0 0; font-size: 14px; font-weight: 500; color: #475569; }
              .rep-title { font-size: 16px; font-weight: bold; margin-top: 15px; color: #0f172a; }
              .meta { font-size: 11px; color: #64748b; margin-top: 4px; }
              table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 11px; }
              th { background: #1e3a8a; color: white; text-align: left; padding: 8px 10px; font-weight: 600; }
              td { padding: 8px 10px; border-bottom: 1px solid #e2e8f0; }
              tr:nth-child(even) td { background-color: #f8fafc; }
              .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
              .summary-card { background: #f1f5f9; padding: 10px; border-radius: 4px; border-left: 3px solid #1e3a8a; }
              .summary-card span { font-size: 10px; color: #64748b; text-transform: uppercase; display: block; }
              .summary-card strong { font-size: 13px; color: #0f172a; }
              @media print {
                @page { margin: 15mm; size: auto; }
                body { padding: 0; }
              }
            </style>
          </head>
          <body>
            <div class="header">
              <h1>${rep.institution}</h1>
              <h2>${rep.department} • ${rep.union}</h2>
              <div class="rep-title">${rep.title}</div>
              <div class="meta">Report Generated: ${rep.generatedAt} | Authorized Treasurer: ${rep.generatedBy}</div>
            </div>
            <div class="summary-grid">
              ${Object.entries(rep.summary || {}).map(([k, v]) => `
                <div class="summary-card">
                  <span>${k}</span>
                  <strong>${v}</strong>
                </div>
              `).join('')}
            </div>
            <table>
              <thead>
                <tr>${rep.headers.map(h => `<th>${h}</th>`).join('')}</tr>
              </thead>
              <tbody>
                ${rep.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}
              </tbody>
            </table>
            <script>
              window.onload = function() {
                window.print();
              };
            <\/script>
          </body>
          </html>
        `);
        printWin.document.close();
        onNotify({ message: 'Print preview opened. Select "Save as PDF" to save.', type: 'info' });
      };

      // Export Report Action
      const handleExportReport = async (reportType, format) => {
        try {
          const rep = await ApiService.call('exportReport', session.sessionToken, reportType, format);
          const safeTitle = rep.title.replace(/[^a-zA-Z0-9_-]/g, '_');
          const dateSlug = new Date().toISOString().split('T')[0];

          if (format === 'csv') {
            let csvStr = '\uFEFF';
            csvStr += `"${rep.institution}"\r\n`;
            csvStr += `"${rep.department} - ${rep.union}"\r\n`;
            csvStr += `"${rep.title}"\r\n`;
            csvStr += `"Generated: ${rep.generatedAt}"\r\n\r\n`;
            csvStr += rep.headers.map(h => `"${h}"`).join(',') + '\r\n';
            rep.rows.forEach(r => {
              csvStr += r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',') + '\r\n';
            });
            downloadFile(`${safeTitle}_${dateSlug}.csv`, csvStr, 'text/csv;charset=utf-8;');
            onNotify({ message: 'CSV report downloaded!', type: 'success' });

          } else if (format === 'xlsx' || format === 'docx') {
            // Open Built-In Interactive Excel / Word Viewer immediately so user can view & download without needing MS Office installed
            setReportPreview({ rep, format, safeTitle, dateSlug });

          } else if (format === 'pdf') {
            openPrintPdf(rep);
          }

        } catch (err) {
          onNotify({ message: 'Report export failed: ' + err.message, type: 'error' });
        }
      };

      return (
        <div className="flex-grow flex flex-col md:flex-row h-screen h-[100dvh] overflow-hidden bg-slate-50">
          
          {/* =========================================
              SIDEBAR (Desktop & Collapsible Mobile)
             ========================================= */}
          <aside className={`
            fixed inset-y-0 left-0 z-40 w-64 bg-white border-r border-slate-200 flex flex-col transition-transform duration-200 ease-in-out md:static md:translate-x-0 md:h-full md:flex-shrink-0
            ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'}
          `}>
            {/* Header info */}
            <div className="p-4 border-b border-slate-100 flex items-center justify-between">
              <div>
                <span className="text-[10px] font-bold text-primary-800 uppercase tracking-wider block">Admin Panel</span>
                <h3 className="text-sm font-bold text-slate-900 uppercase">ITSU MANAGEMENT</h3>
              </div>
              <button onClick={() => setSidebarOpen(false)} className="md:hidden text-slate-400 hover:text-slate-600">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            {/* Nav Links */}
            <nav className="flex-grow p-3 space-y-1 overflow-y-auto">
              {[
                { id: 'overview', label: 'Overview', icon: 'layout-dashboard' },
                { id: 'students', label: 'Student Records', icon: 'users' },
                { id: 'selections', label: 'Lacoste Selections', icon: 'shirt' },
                { id: 'pending', label: 'Pending Students', icon: 'clock', badge: stats?.overview?.pendingStudents },
                { id: 'analytics', label: 'Analytics', icon: 'pie-chart' },
                { id: 'reports', label: 'Reports & Exports', icon: 'file-text' },
                { id: 'audit', label: 'Audit Logs', icon: 'shield-alert' },
              ].map(item => (
                <button
                  key={item.id}
                  onClick={() => { setActiveTab(item.id); setSidebarOpen(false); }}
                  className={`w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-xs font-semibold transition ${
                    activeTab === item.id
                      ? 'bg-primary-50 text-primary-900 border border-primary-200'
                      : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                  }`}
                >
                  <div className="flex items-center gap-2.5">
                    <Icon name={item.icon} className={`w-4 h-4 ${activeTab === item.id ? 'text-primary-800' : 'text-slate-400'}`} />
                    <span>{item.label}</span>
                  </div>
                  {item.badge !== undefined && item.badge > 0 && (
                    <span className="bg-amber-100 text-amber-800 text-[10px] px-2 py-0.5 rounded-full font-bold">
                      {item.badge}
                    </span>
                  )}
                </button>
              ))}

              {/* Mobile-Only Quick Actions (Full-width native sidebar rows on phone) */}
              <div className="md:hidden pt-3 mt-3 border-t border-slate-100 space-y-1">
                <div className="px-3 pb-1 text-[10px] font-bold uppercase tracking-wider text-slate-400">
                  Quick Actions
                </div>

                <button
                  type="button"
                  onClick={handleToggleSubmissions}
                  className="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-xs font-semibold text-slate-700 hover:bg-slate-100 transition"
                >
                  <div className="flex items-center gap-2.5">
                    <Icon name="power" className={`w-4 h-4 ${stats?.overview?.submissionStatus === 'OPEN' ? 'text-emerald-600' : 'text-rose-500'}`} />
                    <span>Portal Status</span>
                  </div>
                  <div className="flex items-center gap-1.5">
                    <span className={`text-[10px] font-bold uppercase ${
                      stats?.overview?.submissionStatus === 'OPEN' ? 'text-emerald-700' : 'text-rose-600'
                    }`}>
                      {stats?.overview?.submissionStatus || 'OPEN'}
                    </span>
                    <span className={`w-7 h-4 rounded-full p-0.5 flex items-center transition-colors ${
                      stats?.overview?.submissionStatus === 'OPEN' ? 'bg-emerald-500' : 'bg-slate-300'
                    }`}>
                      <span className={`w-3 h-3 rounded-full bg-white shadow-xs transform transition-transform ${
                        stats?.overview?.submissionStatus === 'OPEN' ? 'translate-x-3' : 'translate-x-0'
                      }`} />
                    </span>
                  </div>
                </button>

                <button
                  type="button"
                  onClick={() => { loadStats(); if (activeTab === 'students') loadStudentRecords(); setSidebarOpen(false); }}
                  disabled={isStatsLoading}

                      <p className="text-[11px] text-white/80">
                        {reportPreview.rep.institution} • {reportPreview.rep.department} ({reportPreview.rep.rows.length} records)
                      </p>
                    </div>
                  </div>

                  {/* Format Switcher & Download / Print Controls */}
                  <div className="flex items-center gap-2 flex-wrap">
                    <div className="bg-black/20 p-0.5 rounded-lg flex items-center text-xs">
                      <button
                        type="button"
                        onClick={() => setReportPreview({ ...reportPreview, format: 'xlsx' })}
                        className={`px-2.5 py-1 rounded-md font-semibold transition ${
                          reportPreview.format === 'xlsx' ? 'bg-white text-[#107C41]' : 'text-white/85 hover:text-white'
                        }`}
                      >
                        Excel View
                      </button>
                      <button
                        type="button"
                        onClick={() => setReportPreview({ ...reportPreview, format: 'docx' })}
                        className={`px-2.5 py-1 rounded-md font-semibold transition ${
                          reportPreview.format === 'docx' ? 'bg-white text-[#185ABD]' : 'text-white/85 hover:text-white'
                        }`}
                      >
                        Word View
                      </button>
                    </div>

                    {reportPreview.format === 'xlsx' ? (
                      <button
                        type="button"
                        onClick={() => downloadTrueExcel(reportPreview.rep, reportPreview.safeTitle, reportPreview.dateSlug)}
                        className="bg-white text-[#107C41] hover:bg-emerald-50 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 shadow-xs transition"
                      >
                        <Icon name="download" className="w-3.5 h-3.5" />
                        <span>Download .xlsx</span>
                      </button>
                    ) : (
                      <button
                        type="button"
                        onClick={() => downloadTrueWord(reportPreview.rep, reportPreview.safeTitle, reportPreview.dateSlug)}
                        className="bg-white text-[#185ABD] hover:bg-blue-50 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 shadow-xs transition"
                      >
                        <Icon name="download" className="w-3.5 h-3.5" />
                        <span>Download .doc</span>
                      </button>
                    )}

                    <button
                      type="button"
                      onClick={() => downloadViewableHtml(reportPreview.rep, reportPreview.format, reportPreview.safeTitle, reportPreview.dateSlug)}
                      className="bg-white/15 hover:bg-white/25 text-white border border-white/25 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition"
                      title="Downloads a self-contained file that opens directly in Chrome even without Microsoft Office installed"
                    >
                      <Icon name="globe" className="w-3.5 h-3.5" />
                      <span>Browser Copy (.html)</span>
                    </button>

                    <button
                      type="button"
                      onClick={() => openPrintPdf(reportPreview.rep)}
                      className="bg-white/15 hover:bg-white/25 text-white border border-white/25 px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition"
                    >
                      <Icon name="printer" className="w-3.5 h-3.5" />
                      <span>Print / PDF</span>
                    </button>

                    <button
                      type="button"
                      onClick={() => setReportPreview(null)}
                      className="p-1.5 rounded-lg bg-white/10 hover:bg-white/25 text-white transition ml-1"
                      title="Close Viewer"
                    >
                      <Icon name="x" className="w-4 h-4" />
                    </button>
                  </div>
                </div>

                {/* BODY: EXCEL SPREADSHEET MODE vs WORD DOCUMENT MODE */}
                {reportPreview.format === 'xlsx' ? (
                  <div className="flex-1 flex flex-col overflow-hidden bg-slate-100">
                    {/* Excel Formula Bar */}
                    <div className="bg-white border-b border-slate-300 px-3 py-1.5 flex items-center gap-2 text-xs text-slate-600">
                      <span className="font-mono font-bold bg-slate-100 border border-slate-300 px-2 py-0.5 rounded text-slate-700">A1</span>
                      <span className="italic font-serif font-bold text-slate-400 px-1">fx</span>
                      <div className="flex-1 bg-slate-50 border border-slate-200 px-2.5 py-0.5 rounded text-slate-800 font-medium truncate">
                        {reportPreview.rep.institution} — {reportPreview.rep.title} (Generated: {reportPreview.rep.generatedAt})
                      </div>
                    </div>

                    {/* Excel Grid Canvas */}
                    <div className="flex-1 overflow-auto bg-white">
                      <table className="w-full border-collapse text-xs">
                        <thead className="sticky top-0 z-10">
                          {/* Excel Column Letters Row (A, B, C...) */}
                          <tr className="bg-slate-200 text-slate-600 font-mono text-[11px]">
                            <th className="w-10 border border-slate-300 py-1 text-center bg-slate-200">#</th>
                            {reportPreview.rep.headers.map((_, colIdx) => (
                              <th key={colIdx} className="border border-slate-300 py-1 px-2 text-center font-semibold">
                                {String.fromCharCode(65 + colIdx)}
                              </th>
                            ))}
                          </tr>
                          {/* Table Header Row */}
                          <tr className="bg-[#107C41] text-white">
                            <th className="border border-slate-300 py-2 text-center font-mono text-[11px] bg-slate-100 text-slate-500">1</th>
                            {reportPreview.rep.headers.map((h, i) => (
                              <th key={i} className="border border-[#0c5e31] py-2 px-3 text-left font-bold whitespace-nowrap">
                                {h}
                              </th>
                            ))}
                          </tr>
                        </thead>
                        <tbody>
                          {reportPreview.rep.rows.length === 0 ? (
                            <tr>
                              <td className="border border-slate-200 py-2 text-center font-mono text-slate-400 bg-slate-50">2</td>
                              <td colSpan={reportPreview.rep.headers.length} className="border border-slate-200 py-8 text-center text-slate-400">
                                No records found for this report.
                              </td>
                            </tr>
                          ) : (
                            reportPreview.rep.rows.map((row, rIdx) => (
                              <tr key={rIdx} className="hover:bg-emerald-50/40 even:bg-slate-50/60">
                                <td className="border border-slate-300 py-1.5 px-2 text-center font-mono text-[11px] bg-slate-100 text-slate-500 select-none">
                                  {rIdx + 2}
                                </td>
                                {row.map((cell, cIdx) => (
                                  <td key={cIdx} className="border border-slate-200 py-1.5 px-3 text-slate-800 whitespace-nowrap">
                                    {String(cell ?? '')}
                                  </td>
                                ))}
                              </tr>
                            ))
                          )}
                        </tbody>
                      </table>
                    </div>

                    {/* Excel Bottom Sheet Tab & Summary Status Bar */}
                    <div className="bg-slate-200 border-t border-slate-300 px-4 py-1.5 flex flex-wrap items-center justify-between gap-2 text-[11px]">
                      <div className="flex items-center gap-2">
                        <span className="bg-white text-[#107C41] font-bold px-3 py-1 rounded-t border border-b-0 border-slate-300 shadow-2xs">
                          ITSU_Report
                        </span>
                        <span className="text-slate-500">Ready</span>
                      </div>
                      <div className="flex items-center gap-4 text-slate-600 font-medium">
                        {Object.entries(reportPreview.rep.summary || {}).map(([k, v]) => (
                          <span key={k}>{k}: <strong className="text-slate-900">{v}</strong></span>
                        ))}
                      </div>
                    </div>
                  </div>
                ) : (
                  /* WORD DOCUMENT A4 PAGE CANVAS */
                  <div className="flex-1 overflow-auto bg-slate-200/80 p-4 sm:p-8">
                    <div className="max-w-3xl mx-auto bg-white shadow-lg border border-slate-300 rounded-xs p-6 sm:p-12 min-h-full text-slate-900">
                      <div className="border-b-2 border-[#185ABD] pb-4 mb-5">
                        <h1 className="text-lg sm:text-xl font-serif font-bold text-[#1e3a8a] uppercase tracking-wide">
                          {reportPreview.rep.institution}
                        </h1>
                        <p className="text-xs sm:text-sm font-semibold text-slate-600 mt-0.5">
                          {reportPreview.rep.department} • {reportPreview.rep.union}
                        </p>
                        <h2 className="text-base sm:text-lg font-bold text-slate-900 mt-3">
                          {reportPreview.rep.title}
                        </h2>
                        <p className="text-[11px] text-slate-500 mt-1">
                          Generated: {reportPreview.rep.generatedAt} | Authorized Treasurer: {reportPreview.rep.generatedBy}
                        </p>
                      </div>

                      {reportPreview.rep.summary && Object.keys(reportPreview.rep.summary).length > 0 && (
                        <div className="bg-slate-50 border border-slate-200 rounded-lg p-3.5 mb-5 text-xs">
                          <div className="font-bold text-slate-700 uppercase tracking-wider text-[10px] mb-2">
                            Executive Summary
                          </div>
                          <div className="grid grid-cols-2 sm:grid-cols-3 gap-2.5">
                            {Object.entries(reportPreview.rep.summary).map(([k, v]) => (
                              <div key={k} className="bg-white border border-slate-200 rounded p-2">
                                <span className="text-[10px] text-slate-500 block">{k}</span>
                                <strong className="text-sm text-slate-900">{v}</strong>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      <div className="overflow-x-auto">
                        <table className="w-full border-collapse text-xs">
                          <thead>
                            <tr className="bg-[#1e3a8a] text-white">
                              {reportPreview.rep.headers.map((h, i) => (
                                <th key={i} className="border border-[#1e3a8a] py-2 px-2.5 text-left font-semibold">
                                  {h}
                                </th>
                              ))}
                            </tr>
                          </thead>
                          <tbody>
                            {reportPreview.rep.rows.map((r, rIdx) => (
                              <tr key={rIdx} className="even:bg-slate-50">
                                {r.map((c, cIdx) => (
                                  <td key={cIdx} className="border border-slate-300 py-1.5 px-2.5 text-slate-800">
                                    {String(c ?? '')}
                                  </td>
                                ))}
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}

              </div>
            </div>
          )}

        </div>
      );
    }

    // ==========================================
    // MAIN APP CONTROLLER
    // ==========================================
    function App() {
      const [view, setView] = useState('portal'); // 'portal' | 'treasurer'
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [treasurerSession, setTreasurerSession] = useState(() => {
        try {
          const saved = localStorage.getItem(SESSION_STORAGE_KEY);
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });
      const [settings, setSettings] = useState(null);
      const [toast, setToast] = useState(null);

      // Load initial settings
      useEffect(() => {
        ApiService.call('getPortalSettings')
          .then(res => setSettings(res))
          .catch(err => console.warn('Could not fetch portal settings:', err));
      }, []);

      const showNotification = (notification) => {
        setToast(notification);
        setTimeout(() => setToast(null), 4000);
      };

      const handleLoginSuccess = (sessionData) => {
        setTreasurerSession(sessionData);
        try {
          localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(sessionData));
        } catch (e) {}
        setView('treasurer');
        showNotification({ message: 'Welcome back, Treasurer!', type: 'success' });
      };

      const handleLogout = async () => {
        if (treasurerSession?.sessionToken) {
          try {
            await ApiService.call('adminLogout', treasurerSession.sessionToken);
          } catch (e) {}
        }
        setTreasurerSession(null);
        try {
          localStorage.removeItem(SESSION_STORAGE_KEY);
        } catch (e) {}
        setView('portal');
        showNotification({ message: 'Logged out successfully.', type: 'info' });
      };

      const handleOpenTreasurer = () => {
        if (treasurerSession) {
          setView('treasurer');
        } else {
          setShowLoginModal(true);
        }
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 font-sans">
          
          {/* Active View */}
          {view === 'treasurer' && treasurerSession ? (
            <TreasurerDashboard
              session={treasurerSession}
              onLogout={handleLogout}
              onNotify={showNotification}
              onOpenPortal={() => setView('portal')}
            />
          ) : (
            <StudentPortal
              settings={settings}
              onNotify={showNotification}
              onOpenTreasurer={handleOpenTreasurer}
            />
          )}

          {/* Treasurer Login Modal */}
          <TreasurerLoginModal
            isOpen={showLoginModal}
            onClose={() => setShowLoginModal(false)}
            onLoginSuccess={handleLoginSuccess}
            onNotify={showNotification}
          />

          {/* Toast Container */}
          <Toast toast={toast} onClose={() => setToast(null)} />

        </div>
      );
    }

    // Render the React application
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

</body>
</html>
