<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITSU Lacoste Verification & Collection Portal | Takoradi Technical University</title>
  
  <!-- Fonts: Inter & Lora for elegant university portal typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Lora', 'Playfair Display', 'Georgia', 'serif'],
          },
          colors: {
            primary: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              300: '#93c5fd',
              400: '#60a5fa',
              500: '#3b82f6',
              600: '#2563eb', // Royal Blue
              700: '#1d4ed8',
              800: '#1e40af', // TTU Navy/Blue
              900: '#1e3a8a',
            },
            surface: {
              light: '#f8fafc',
              border: '#e2e8f0',
              text: '#0f172a',
              muted: '#64748b'
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- SheetJS (True Binary .xlsx Excel Generator - Async so it never blocks page render) -->
  <script async src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- React 18 & Babel Standalone for seamless execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin="anonymous"></script>

  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      background-color: #f8fafc;
      color: #0f172a;
    }
    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    /* Print styling for PDF/Print reports */
    @media print {
      body * {
        visibility: hidden;
      }
      #printable-report, #printable-report * {
        visibility: visible;
      }
      #printable-report {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 20px;
        background: white !important;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>

  <!-- In-Memory & LocalStorage Mock Backend Adapter for Local Browser Execution -->
  <!-- Automatically active when running locally (file:// or localhost) and bypassed on Google Apps Script -->
  <script>
    (function() {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        return; // Running inside live Google Apps Script container
      }

      const DB_KEY = 'itsu_lacoste_portal_db_v8';

      function getDb() {
        try {
          ['itsu_lacoste_portal_db_v1', 'itsu_lacoste_portal_db_v2', 'itsu_lacoste_portal_db_v3', 'itsu_lacoste_portal_db_v4', 'itsu_lacoste_portal_db_v5', 'itsu_lacoste_portal_db_v6', 'itsu_lacoste_portal_db_v7'].forEach(k => localStorage.removeItem(k));
        } catch (e) {}
        const stored = localStorage.getItem(DB_KEY);
        if (stored) {
          try {
            const parsed = JSON.parse(stored);
            if (parsed && Array.isArray(parsed.students) && parsed.admin) {
              return parsed;
            }
          } catch (e) {}
        }
        const initial = {
          settings: {
            portalName: 'ITSU Lacoste Verification & Collection Portal',
            submissionStatus: 'OPEN',
            availableColours: ['Blue', 'White'],
            availableSizes: ['S', 'M', 'L', 'XL', 'XXL', 'XXXL'],
            maxSubmissions: 1
          },
          students: [
            { fullName: 'ANTHONY MACLEAN', indexNumber: '0721000001', paymentStatus: 'PAID', paymentReference: 'PRE-ORDER', dateAdded: '2026-11-09' }
          ],
          selections: [],
          admin: {
            email: 'anthonymaclean100@gmail.com',
            password: 'ITSU2026',
            mustChangePassword: false
          },
          auditLogs: [
            { logId: 'LOG-INIT', timestamp: new Date().toISOString(), user: 'SYSTEM', action: 'SYSTEM_INITIALIZED', details: 'Database initialized', status: 'SUCCESS' }
          ]
        };
        localStorage.setItem(DB_KEY, JSON.stringify(initial));
        return initial;
      }

      function saveDb(db) {
        localStorage.setItem(DB_KEY, JSON.stringify(db));
      }

      window.MockBackend = {
        getPortalSettings() {
          const db = getDb();
          return db.settings;
        },

        verifyStudent(fullName, indexNumber) {
          const db = getDb();
          const normIdx = String(indexNumber || '').trim().toUpperCase();
          const normName = String(fullName || '').trim().toLowerCase();

          if (db.settings.submissionStatus !== 'OPEN') {
            return { verified: false, isClosed: true, message: 'Submissions are currently closed. Please contact the ITSU Treasurer for assistance.' };
          }

          const existing = db.selections.find(s => s.indexNumber.toUpperCase() === normIdx);
          if (existing) {
            return { verified: false, alreadySubmitted: true, submission: existing, message: 'Your Lacoste selection has already been recorded.' };
          }

          if (!Array.isArray(db.students) || db.students.length === 0) {
            return {
              verified: false,
              message: "We couldn't verify your details. Your name and index number are not on the pre-ordered student register."
            };
          }

          const student = db.students.find(s => {
            if (String(s.indexNumber || '').trim().toUpperCase() !== normIdx) return false;
            const sName = String(s.fullName || '').trim().toLowerCase().replace(/\s+/g, ' ');
            const cleanInputName = normName.replace(/\s+/g, ' ');
            if (!sName || !cleanInputName) return false;
            if (sName === cleanInputName) return true;
            const inputWords = cleanInputName.split(' ').filter(w => w.length > 1);
            const sheetWords = sName.split(' ').filter(w => w.length > 1);
            if (inputWords.length < 2) return false;
            const matchCount = inputWords.filter(w => sheetWords.includes(w)).length;
            return matchCount === inputWords.length || matchCount >= Math.max(2, sheetWords.length);
          });

          if (!student || student.paymentStatus !== 'PAID') {
            return {
              verified: false,
              message: "We couldn't verify your details. Please check your name and index number or contact the ITSU Treasurer."
            };
          }

          return {
            verified: true,
            student: { fullName: student.fullName, indexNumber: student.indexNumber },
            token: btoa(`${student.indexNumber}|${student.fullName}|${Date.now() + 1800000}`),
            availableColours: db.settings.availableColours,
            availableSizes: db.settings.availableSizes
          };
        },

        submitSelection(token, colour, size) {
          const db = getDb();
          let payload;
          try { payload = atob(token).split('|'); } catch(e) { throw new Error('Invalid or expired student verification session.'); }
          const [indexNumber, fullName] = payload;

          if (db.settings.submissionStatus !== 'OPEN') {
            throw new Error('Submissions are closed.');
          }

          const registeredStudent = (db.students || []).find(s => String(s.indexNumber || '').trim().toUpperCase() === String(indexNumber || '').trim().toUpperCase());
          if (!registeredStudent || registeredStudent.paymentStatus !== 'PAID') {
            throw new Error('Student is not registered in the pre-ordered student list.');
          }

          const existing = db.selections.find(s => s.indexNumber === indexNumber);
          if (existing) {
            throw new Error('Your Lacoste selection has already been recorded.');
          }

          const subId = 'ITSU-LAC-' + Math.random().toString(36).substring(2, 8).toUpperCase();
          const submittedAt = new Date().toISOString().replace('T', ' ').substring(0, 19);

          const newSub = {
            submissionId: subId,
            fullName: fullName,
            indexNumber: indexNumber,
            selectedColour: colour,
            selectedSize: size,
            submittedAt: submittedAt,
            status: 'CONFIRMED'
          };
          db.selections.push(newSub);
          db.auditLogs.unshift({
            logId: 'LOG-' + Math.random().toString(36).substring(2, 7).toUpperCase(),
            timestamp: new Date().toISOString(),
            user: indexNumber,
            action: 'SUBMISSION_CONFIRMED',
            details: JSON.stringify({ colour, size, subId }),
            status: 'SUCCESS'
          });
          saveDb(db);

          return {
            success: true,
            submissionId: subId,
            fullName: fullName,
            indexNumber: indexNumber,
            selectedColour: colour,
            selectedSize: size,
            submittedAt: submittedAt
          };
        },

        adminLogin(email, password) {
          const db = getDb();
          const normEmail = (email || '').trim().toLowerCase();
          const normPwd = (password || '').trim();

          const isAuthorizedEmail = normEmail === (db.admin.email || '').toLowerCase() || normEmail === 'anthonymaclean100@gmail.com';
          const isCorrectPassword = normPwd === db.admin.password || normPwd === 'ITSU2026' || normPwd === 'ITSU@Treasurer2026!';

          if (!isAuthorizedEmail || !isCorrectPassword) {
            throw new Error('Invalid email or password.');
          }

          db.admin.password = normPwd;
          const token = 'MOCK-SESSION-' + Math.random().toString(36).substring(2);
          db.auditLogs.unshift({
            logId: 'LOG-' + Math.random().toString(36).substring(2, 7).toUpperCase(),
            timestamp: new Date().toISOString(),
            user: normEmail,
            action: 'LOGIN_SUCCESS',
            details: 'Treasurer authenticated successfully',
            status: 'SUCCESS'
          });
          saveDb(db);

          return {
            success: true,
            sessionToken: token,
            email: normEmail,
            mustChangePassword: false
          };
        },

        adminLogout(token) {
          return { success: true };
        },

        changeAdminPassword(sessionToken, arg2, arg3) {
          const db = getDb();
          let currentPassword = arg3 !== undefined ? arg2 : null;
          let newPassword = arg3 !== undefined ? arg3 : arg2;
          if (currentPassword && currentPassword !== db.admin.password && currentPassword !== 'ITSU2026') {
            throw new Error('Current password is incorrect.');
          }
          db.admin.password = newPassword;
          db.admin.mustChangePassword = false;
          db.auditLogs.unshift({
            logId: 'LOG-PWD',
            timestamp: new Date().toISOString(),
            user: db.admin.email,
            action: 'PASSWORD_CHANGED',
            details: 'Treasurer password updated',
            status: 'SUCCESS'
          });
          saveDb(db);
          return { success: true };
        },

        getDashboardStats(sessionToken) {
          const db = getDb();
          const paidStudents = db.students.filter(s => s.paymentStatus === 'PAID');
          const totalPaid = paidStudents.length;
          const totalSub = db.selections.length;
          const pending = Math.max(0, totalPaid - totalSub);
          const completion = totalPaid > 0 ? Math.round((totalSub / totalPaid) * 100) : 0;

          let blueCount = 0;
          let whiteCount = 0;
          let collectedCount = 0;
          const sizeCounts = { S: 0, M: 0, L: 0, XL: 0, XXL: 0, XXXL: 0 };
          const matrix = {
            S: { Blue: 0, White: 0, Total: 0 },
            M: { Blue: 0, White: 0, Total: 0 },
            L: { Blue: 0, White: 0, Total: 0 },
            XL: { Blue: 0, White: 0, Total: 0 },
            XXL: { Blue: 0, White: 0, Total: 0 },
            XXXL: { Blue: 0, White: 0, Total: 0 }
          };

          db.selections.forEach(s => {
            const c = (s.selectedColour || '').toLowerCase();
            const sz = (s.selectedSize || '').toUpperCase();
            if (c === 'blue') blueCount++;
            if (c === 'white') whiteCount++;
            if (s.collectionStatus === 'Collected' || String(s.status || '').includes('COLLECTED')) collectedCount++;
            if (sizeCounts[sz] !== undefined) sizeCounts[sz]++;
            if (matrix[sz]) {
              if (c === 'blue') matrix[sz].Blue++;
              if (c === 'white') matrix[sz].White++;
              matrix[sz].Total++;
            }
          });

          return {
            overview: {
              totalPaidStudents: totalPaid,
              totalSubmissions: totalSub,
              pendingStudents: pending,
              completionPercentage: completion,
              collectedCount: collectedCount,
              uncollectedCount: Math.max(0, totalSub - collectedCount),
              submissionStatus: db.settings.submissionStatus
            },
            colours: {
              blue: { count: blueCount, percentage: totalSub > 0 ? Math.round((blueCount/totalSub)*100) : 0 },
              white: { count: whiteCount, percentage: totalSub > 0 ? Math.round((whiteCount/totalSub)*100) : 0 }
            },
            sizes: sizeCounts,
            matrix: matrix,
            recentSubmissions: db.selections.slice(-10).reverse().map(s => ({
              submissionId: s.submissionId,
              fullName: s.fullName,
              indexNumber: s.indexNumber,
              colour: s.selectedColour,
              size: s.selectedSize,
              submittedAt: s.submittedAt,
              collectionStatus: s.collectionStatus || 'Not Collected'
            }))
          };
        },

        getStudentSelections(sessionToken, filters) {
          const db = getDb();
          const selMap = new Map();
          db.selections.forEach(s => selMap.set(String(s.indexNumber || '').toUpperCase(), s));

          let list = db.students.map(st => {
            const sel = selMap.get(String(st.indexNumber || '').toUpperCase());
            const isCollected = sel && (sel.collectionStatus === 'Collected' || String(sel.status || '').includes('COLLECTED'));
            return {
              fullName: st.fullName,
              indexNumber: st.indexNumber,
              paymentStatus: st.paymentStatus,
              paymentReference: st.paymentReference,
              submissionId: sel ? sel.submissionId : '-',
              selectedColour: sel ? sel.selectedColour : '-',
              selectedSize: sel ? sel.selectedSize : '-',
              submittedAt: sel ? sel.submittedAt : '-',
              submissionStatus: sel ? 'Submitted' : 'Pending',
              collectionStatus: sel ? (isCollected ? 'Collected' : 'Not Collected') : '-',
              collectedAt: sel && sel.collectedAt ? sel.collectedAt : '-'
            };
          });

          if (filters && filters.search) {
            const q = filters.search.toLowerCase();
            list = list.filter(r => r.fullName.toLowerCase().includes(q) || r.indexNumber.toLowerCase().includes(q));
          }
          if (filters && filters.colour && filters.colour !== 'ALL') {
            list = list.filter(r => r.selectedColour.toLowerCase() === filters.colour.toLowerCase());
          }
          if (filters && filters.size && filters.size !== 'ALL') {
            list = list.filter(r => r.selectedSize.toUpperCase() === filters.size.toUpperCase());
          }
          if (filters && filters.status && filters.status !== 'ALL') {
            if (filters.status === 'Collected' || filters.status === 'Not Collected') {
              list = list.filter(r => r.collectionStatus === filters.status);
            } else {
              list = list.filter(r => r.submissionStatus.toLowerCase() === filters.status.toLowerCase());
            }
          }
          return list;
        },

        getPendingStudents(sessionToken) {
          const db = getDb();
          const subSet = new Set(db.selections.map(s => String(s.indexNumber || '').toUpperCase()));
          return db.students
            .filter(st => st.paymentStatus === 'PAID' && !subSet.has(String(st.indexNumber || '').toUpperCase()))
            .map(st => ({
              fullName: st.fullName,
              indexNumber: st.indexNumber,
              paymentStatus: st.paymentStatus,
              paymentReference: st.paymentReference,
              selectionStatus: 'Pending'
            }));
        },

        addPaidStudent(sessionToken, studentData) {
          const db = getDb();
          const normIdx = String(studentData.indexNumber || '').trim().toUpperCase();
          const exists = db.students.some(s => String(s.indexNumber).trim().toUpperCase() === normIdx);
          if (exists) throw new Error('Student index number already registered.');
          db.students.push({
            fullName: String(studentData.fullName || '').trim().toUpperCase(),
            indexNumber: normIdx,
            paymentStatus: 'PAID',
            paymentReference: 'PRE-ORDER',
            dateAdded: new Date().toISOString().split('T')[0]
          });
          saveDb(db);
          return { success: true, added: 1, skipped: 0 };
        },

        bulkAddPaidStudents(sessionToken, studentsList) {
          const db = getDb();
          if (!Array.isArray(studentsList) || studentsList.length === 0) {
            throw new Error('No valid student records provided.');
          }
          const existingSet = new Set(db.students.map(s => String(s.indexNumber || '').trim().toUpperCase()));
          let added = 0;
          let skipped = 0;
          const today = new Date().toISOString().split('T')[0];

          studentsList.forEach(item => {
            const fullName = String(item.fullName || '').trim().toUpperCase();
            const indexNumber = String(item.indexNumber || '').trim().toUpperCase();
            if (!fullName || !indexNumber) return;
            if (existingSet.has(indexNumber)) {
              skipped++;
              return;
            }
            existingSet.add(indexNumber);
            db.students.push({
              fullName,
              indexNumber,
              paymentStatus: 'PAID',
              paymentReference: 'PRE-ORDER',
              dateAdded: today
            });
            added++;
          });

          saveDb(db);
          return { success: true, added, skipped };
        },

        updatePaidStudent(sessionToken, oldIndexNumber, updatedData) {
          const db = getDb();
          const oldNorm = String(oldIndexNumber || '').trim().toUpperCase();
          const newNorm = String(updatedData.indexNumber || '').trim().toUpperCase();
          const newName = String(updatedData.fullName || '').trim().toUpperCase();
          if (!newName || !newNorm) throw new Error('Full Name and Index Number are required.');

          const stIdx = db.students.findIndex(s => String(s.indexNumber || '').trim().toUpperCase() === oldNorm);
          if (stIdx === -1) throw new Error('Student record not found.');

          if (oldNorm !== newNorm && db.students.some((s, i) => i !== stIdx && String(s.indexNumber || '').trim().toUpperCase() === newNorm)) {
            throw new Error('Another student already has that index number.');
          }

          db.students[stIdx].fullName = newName;
          db.students[stIdx].indexNumber = newNorm;

          const sel = db.selections.find(s => String(s.indexNumber || '').trim().toUpperCase() === oldNorm);
          if (sel) {
            sel.fullName = newName;
            sel.indexNumber = newNorm;
          }

          db.auditLogs.unshift({
            logId: 'LOG-' + Math.random().toString(36).substring(2, 7).toUpperCase(),
            timestamp: new Date().toISOString(),
            user: db.admin.email,
            action: 'STUDENT_UPDATED',
            details: JSON.stringify({ oldIndexNumber: oldNorm, newIndexNumber: newNorm, fullName: newName }),
            status: 'SUCCESS'
          });

          saveDb(db);
          return { success: true };
        },

        deletePaidStudent(sessionToken, indexNumber) {
          const db = getDb();
          const normIdx = String(indexNumber || '').trim().toUpperCase();
          db.students = db.students.filter(s => String(s.indexNumber || '').trim().toUpperCase() !== normIdx);
          db.selections = db.selections.filter(s => String(s.indexNumber || '').trim().toUpperCase() !== normIdx);
          db.auditLogs.unshift({
            logId: 'LOG-' + Math.random().toString(36).substring(2, 7).toUpperCase(),
            timestamp: new Date().toISOString(),
            user: db.admin.email,
            action: 'STUDENT_DELETED',
            details: `Removed student ${normIdx} from pre-order register`,
            status: 'WARNING'
          });
          saveDb(db);
          return { success: true };
        },

        clearAllRecords(sessionToken) {
          const db = getDb();
          const count = db.students.length;
          db.students = [];
          db.selections = [];
          db.auditLogs.unshift({
            logId: 'LOG-' + Math.random().toString(36).substring(2, 7).toUpperCase(),
            timestamp: new Date().toISOString(),
            user: db.admin.email,
            action: 'REGISTER_CLEARED',
            details: `Cleared all ${count} student record(s) and selections`,
            status: 'WARNING'
          });
          saveDb(db);
          return { success: true };
        },

        toggleCollectionStatus(sessionToken, indexNumber) {
          const db = getDb();
          const normIdx = String(indexNumber || '').trim().toUpperCase();
          const sel = db.selections.find(s => String(s.indexNumber || '').trim().toUpperCase() === normIdx);
          if (!sel) throw new Error('Student has not submitted a Lacoste selection yet.');

          const currentlyCollected = sel.collectionStatus === 'Collected' || String(sel.status || '').includes('COLLECTED');
          const nextStatus = currentlyCollected ? 'Not Collected' : 'Collected';
          sel.collectionStatus = nextStatus;
          sel.collectedAt = nextStatus === 'Collected' ? new Date().toISOString().replace('T', ' ').substring(0, 19) : '';
          sel.status = nextStatus === 'Collected' ? 'COLLECTED' : 'CONFIRMED';

          db.auditLogs.unshift({
            logId: 'LOG-' + Math.random().toString(36).substring(2, 7).toUpperCase(),
            timestamp: new Date().toISOString(),
            user: db.admin.email,
            action: nextStatus === 'Collected' ? 'SHIRT_COLLECTED' : 'COLLECTION_REVERTED',
            details: `${sel.fullName} (${normIdx}) marked as ${nextStatus}`,
            status: 'SUCCESS'
          });

          saveDb(db);
          return { success: true, collectionStatus: nextStatus, collectedAt: sel.collectedAt };
        },

        updateStudentSelection(sessionToken, indexNumber, selection) {
          const db = getDb();
          const normIdx = String(indexNumber || '').trim().toUpperCase();
          let sel = db.selections.find(s => String(s.indexNumber || '').trim().toUpperCase() === normIdx);
          if (sel) {
            sel.selectedColour = selection.colour;
            sel.selectedSize = selection.size;
            sel.status = 'CORRECTED';
          } else {
            const st = db.students.find(s => String(s.indexNumber || '').trim().toUpperCase() === normIdx);
            db.selections.push({
              submissionId: 'ITSU-LAC-ADM-' + Math.random().toString(36).substring(2, 6).toUpperCase(),
              fullName: st ? st.fullName : 'Student',
              indexNumber: normIdx,
              selectedColour: selection.colour,
              selectedSize: selection.size,
              submittedAt: new Date().toISOString().replace('T', ' ').substring(0, 19),
              status: 'CONFIRMED (Admin)',
              collectionStatus: 'Not Collected'
            });
          }
          saveDb(db);
          return { success: true };
        },

        deleteStudentSelection(sessionToken, indexNumber, reason) {
          const db = getDb();
          const normIdx = String(indexNumber || '').trim().toUpperCase();
          const idx = db.selections.findIndex(s => String(s.indexNumber || '').trim().toUpperCase() === normIdx);
          if (idx !== -1) {
            db.selections.splice(idx, 1);
            saveDb(db);
          }
          return { success: true };
        },

        setSubmissionStatus(sessionToken, status) {
          const db = getDb();
          db.settings.submissionStatus = status;
          saveDb(db);
          return { success: true, submissionStatus: status };
        },

        getAuditLogs(sessionToken) {
          const db = getDb();
          return db.auditLogs;
        },

        exportReport(sessionToken, reportType, format) {
          const db = getDb();
          const sel = db.selections;
          const students = db.students;
          const nowStr = new Date().toISOString().replace('T', ' ').substring(0, 19) + ' GMT';
          let title = '';
          let headers = [];
          let rows = [];
          let summary = {};

          if (reportType === 'COMPLETE_REGISTER') {
            title = 'Complete Student Selection Register';
            headers = ['#', 'Submission ID', 'Full Name', 'Index Number', 'Colour', 'Size', 'Submitted At', 'Collection Status'];
            rows = sel.map((s, idx) => [idx + 1, s.submissionId, s.fullName, s.indexNumber, s.selectedColour, s.selectedSize, s.submittedAt, s.collectionStatus || 'Not Collected']);
            summary = { 'Total Selections': sel.length, 'Collected': sel.filter(s => s.collectionStatus === 'Collected').length };
          } else if (reportType === 'COLLECTION_SIGNOFF') {
            title = 'Physical Distribution & Collection Sign-Off Sheet';
            headers = ['#', 'Full Name', 'Index Number', 'Colour', 'Size', 'Ref ID', 'Collection Status', 'Student Signature'];
            rows = sel.map((s, idx) => [idx + 1, s.fullName, s.indexNumber, s.selectedColour, s.selectedSize, s.submissionId, s.collectionStatus || 'Not Collected', s.collectionStatus === 'Collected' ? 'COLLECTED' : '__________________']);
            summary = { 'Total Eligible for Pickup': sel.length, 'Collected': sel.filter(s => s.collectionStatus === 'Collected').length, 'Awaiting Pickup': sel.filter(s => s.collectionStatus !== 'Collected').length };
          } else if (reportType === 'BLUE_LACOSTE_LIST') {
            title = 'Blue Lacoste Selections List';
            const blue = sel.filter(s => (s.selectedColour || '').toLowerCase() === 'blue');
            headers = ['#', 'Submission ID', 'Full Name', 'Index Number', 'Size', 'Collection Status'];
            rows = blue.map((s, idx) => [idx + 1, s.submissionId, s.fullName, s.indexNumber, s.selectedSize, s.collectionStatus || 'Not Collected']);
            summary = { 'Colour': 'Royal Blue', 'Total Orders': blue.length };
          } else if (reportType === 'WHITE_LACOSTE_LIST') {
            title = 'White Lacoste Selections List';
            const white = sel.filter(s => (s.selectedColour || '').toLowerCase() === 'white');
            headers = ['#', 'Submission ID', 'Full Name', 'Index Number', 'Size', 'Collection Status'];
            rows = white.map((s, idx) => [idx + 1, s.submissionId, s.fullName, s.indexNumber, s.selectedSize, s.collectionStatus || 'Not Collected']);
            summary = { 'Colour': 'Classic White', 'Total Orders': white.length };
          } else if (reportType === 'SIZE_DISTRIBUTION') {
            title = 'Size Distribution Report';
            headers = ['Size', 'Total Count', 'Percentage of Total'];
            rows = ['S', 'M', 'L', 'XL', 'XXL', 'XXXL'].map(sz => {
              const c = sel.filter(s => (s.selectedSize || '').toUpperCase() === sz).length;
              const pct = sel.length > 0 ? Math.round((c / sel.length) * 100) + '%' : '0%';
              return [sz, c, pct];
            });
            summary = { 'Total Submissions': sel.length };
          } else if (reportType === 'COLOUR_SIZE_BREAKDOWN') {
            title = 'Colour and Size Cross-Tabulation Matrix';
            headers = ['Size', 'Blue', 'White', 'Total Order'];
            let gBlue = 0, gWhite = 0;
            rows = ['S', 'M', 'L', 'XL', 'XXL', 'XXXL'].map(sz => {
              const b = sel.filter(s => (s.selectedSize || '').toUpperCase() === sz && (s.selectedColour || '').toLowerCase() === 'blue').length;
              const w = sel.filter(s => (s.selectedSize || '').toUpperCase() === sz && (s.selectedColour || '').toLowerCase() === 'white').length;
              gBlue += b; gWhite += w;
              return [sz, b, w, b + w];
            });
            rows.push(['GRAND TOTAL', gBlue, gWhite, gBlue + gWhite]);
            summary = { 'Total Units': gBlue + gWhite, 'Blue Total': gBlue, 'White Total': gWhite };
          } else if (reportType === 'PENDING_STUDENTS') {
            title = 'Pending Students Register (Unsubmitted Pre-Ordered Students)';
            const subSet = new Set(sel.map(s => String(s.indexNumber || '').toUpperCase()));
            const pend = students.filter(st => st.paymentStatus === 'PAID' && !subSet.has(String(st.indexNumber || '').toUpperCase()));
            headers = ['#', 'Full Name', 'Index Number', 'Status', 'Date Added'];
            rows = pend.map((p, idx) => [idx + 1, p.fullName, p.indexNumber, p.paymentStatus, p.dateAdded || '-']);
            summary = { 'Total Pending Students': pend.length };
          } else {
            title = 'Overall Lacoste Collection Executive Summary';
            headers = ['Metric Category', 'Metric Name', 'Count / Value'];
            const bC = sel.filter(s => (s.selectedColour || '').toLowerCase() === 'blue').length;
            const wC = sel.filter(s => (s.selectedColour || '').toLowerCase() === 'white').length;
            const colC = sel.filter(s => s.collectionStatus === 'Collected').length;
            rows = [
              ['Pre-Order Register', 'Total Pre-Ordered Students', students.length],
              ['Selection Progress', 'Total Confirmed Selections', sel.length],
              ['Selection Progress', 'Total Pending Students', Math.max(0, students.length - sel.length)],
              ['Colour Preferences', 'Royal Blue Lacoste Count', bC],
              ['Colour Preferences', 'Classic White Lacoste Count', wC],
              ['Physical Handout', 'Shirts Collected by Students', colC],
              ['Physical Handout', 'Shirts Awaiting Pickup', Math.max(0, sel.length - colC)]
            ];
            summary = { 'Total Pre-Ordered': students.length, 'Total Submitted': sel.length, 'Total Collected': colC };
          }

          return {
            reportType: reportType,
            title: title,
            institution: 'Takoradi Technical University',
            department: 'Department of Computer Science',
            union: 'Information Technology Students Union (ITSU)',
            generatedAt: nowStr,
            generatedBy: db.admin.email,
            summary: summary,
            headers: headers,
            rows: rows
          };
        }
      };
    })();
  </script>

    // --- ICONS HELPER ---
    // Safely render Lucide icon SVG via DOM helper
    function Icon({ name, className = "w-5 h-5", size = 20 }) {
      const spanRef = useRef(null);
      useEffect(() => {
        if (window.lucide && spanRef.current) {
          spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
          window.lucide.createIcons({
            attrs: { class: className },
            nameAttr: 'data-lucide',
            root: spanRef.current
          });
        }
      }, [name, className]);
      return <span ref={spanRef} className="inline-flex items-center justify-center align-middle" />;
    }

    // --- API SERVICE (Google Apps Script / Mock Bridge) ---
    const ApiService = {
      isAppsScript: typeof google !== 'undefined' && google.script && google.script.run,

      call(funcName, ...args) {
        return new Promise((resolve, reject) => {
          if (this.isAppsScript) {
            google.script.run
              .withSuccessHandler(res => resolve(res))
              .withFailureHandler(err => reject(err instanceof Error ? err : new Error(err.message || String(err))))
              [funcName](...args);
          } else {
            // Local simulation adapter for standalone preview
            if (window.MockBackend && typeof window.MockBackend[funcName] === 'function') {
              setTimeout(() => {
                try {
                  const res = window.MockBackend[funcName](...args);
                  resolve(res);
                } catch (e) {
                  reject(e);
                }
              }, 300); // 300ms realistic network latency
            } else {
              reject(new Error(`Function ${funcName} not found.`));
            }
          }
        });
      }
    };

      const frontShirtSrc = isWhite ? POLO_FRONT_WHITE_IMG : POLO_FRONT_BLUE_IMG;
      const backShirtSrc = isWhite ? POLO_BACK_WHITE_IMG : POLO_BACK_BLUE_IMG;
      // When Lacoste is White -> Logo is Blue; when Lacoste is Blue -> Logo is White
      const crestLogoSrc = isWhite ? ITSU_LOGO_BLUE_IMG : ITSU_LOGO_WHITE_IMG;
      // When Lacoste is White -> Back Text is Blue; when Lacoste is Blue -> Back Text is White

      return (

              {/* Left-Chest Embroidered ITSU Crest (Transparent Background) */}
              <img
                src={crestLogoSrc}
                alt="ITSU Official Embroidered Crest"
                className="absolute select-none pointer-events-none transition-all duration-300"
                style={{
                  top: '29.5%',
                  left: '55.5%',
                  width: compact ? '14%' : '12.2%',
                  height: 'auto',
                  filter: isWhite
                    ? 'drop-shadow(0 0.8px 1px rgba(15, 35, 90, 0.22))'

            {/* BACK FACE: Clean Back Polo + Natural Embroidered Back Typography */}

                backfaceVisibility: 'hidden',
                WebkitBackfaceVisibility: 'hidden',
                transform: 'rotateY(180deg)'

              />
              {/* Natural Embroidered Upper-Back Typography */}
              <div
                className="absolute left-1/2 -translate-x-1/2 flex flex-col items-center justify-center text-center pointer-events-none select-none"

                  ITSU
                </span>
                <span
                  className={compact ? "text-[3.5px] font-bold tracking-tight leading-tight mt-0.5 whitespace-nowrap" : "text-[9px] sm:text-[11px] md:text-[12.5px] font-bold tracking-[0.015em] leading-snug mt-0.5 whitespace-nowrap"}

    }

    // ==========================================
    // COMPONENT: Student Portal Flow
    // ==========================================
    function StudentPortal({ settings, onNotify, onOpenTreasurer }) {
      const [step, setStep] = useState('verify'); // 'verify' | 'select' | 'review' | 'confirmed' | 'already_submitted'
      const [fullName, setFullName] = useState('');
      const [indexNumber, setIndexNumber] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [errorMessage, setErrorMessage] = useState('');
      const [showContactModal, setShowContactModal] = useState(false);
      
      const [verifiedStudent, setVerifiedStudent] = useState(null);
      const [studentToken, setStudentToken] = useState('');
      const [selectedColour, setSelectedColour] = useState('');
      const [selectedSize, setSelectedSize] = useState('');
      const [selectedView, setSelectedView] = useState('front'); // 'front' | 'back'
      const [autoRotate, setAutoRotate] = useState(true);
      const [isHoveringPolo, setIsHoveringPolo] = useState(false);
      const [showSizeGuide, setShowSizeGuide] = useState(false);
      const [submissionResult, setSubmissionResult] = useState(null);
      const [alreadySubmittedData, setAlreadySubmittedData] = useState(null);

      // Animated Front <-> Back Showcase on Step 2
      useEffect(() => {
        if (step !== 'select' || !autoRotate || isHoveringPolo) return;
        const timer = setInterval(() => {
          setSelectedView((prev) => (prev === 'front' ? 'back' : 'front'));
        }, 3600);
        return () => clearInterval(timer);
      }, [step, autoRotate, isHoveringPolo]);

      // Handle Verification
      const handleVerify = async (e) => {
        e.preventDefault();
        setErrorMessage('');
        
        if (!fullName.trim() || !indexNumber.trim()) {
          setErrorMessage('Please enter both your full name and index number.');
          return;
        }

        setIsLoading(true);
        try {
          const res = await ApiService.call('verifyStudent', fullName.trim(), indexNumber.trim());
          if (res.verified) {
            setVerifiedStudent(res.student);
            setStudentToken(res.token);
            if (!selectedColour) setSelectedColour('Blue');
            setStep('select');
          } else if (res.alreadySubmitted) {
            setAlreadySubmittedData(res.submission);
            setStep('already_submitted');
          } else {
            setErrorMessage(res.message || "We couldn't verify your details. Please check your name and index number or contact the ITSU Treasurer.");
          }
        } catch (err) {
          setErrorMessage(err.message || "An unexpected error occurred. Please try again.");
        } finally {
          setIsLoading(false);
        }
      };

      // Handle Submission
      const handleSubmit = async () => {
        if (!selectedColour || !selectedSize) {
          onNotify({ message: 'Please select both a colour and size.', type: 'error' });
          return;
        }

        setIsLoading(true);
        try {
          const res = await ApiService.call('submitSelection', studentToken, selectedColour, selectedSize);
          if (res.success) {
            setSubmissionResult(res);
            setStep('confirmed');
            onNotify({ message: 'Lacoste selection submitted successfully!', type: 'success' });
          } else {
            onNotify({ message: res.message || 'Submission failed.', type: 'error' });
          }
        } catch (err) {
          onNotify({ message: err.message || 'Error saving your selection.', type: 'error' });
        } finally {
          setIsLoading(false);
        }
      };

      // Reset
      const handleStartOver = () => {
        setStep('verify');
        setFullName('');
        setIndexNumber('');
        setVerifiedStudent(null);
        setStudentToken('');
        setSelectedColour('');
        setSelectedSize('');
        setSubmissionResult(null);
        setErrorMessage('');
      };

      // -------------------------------------------------------------
      // 1. STEP: VERIFICATION (SPLIT SCREEN - EXACT MATCH TO IMAGE 1)
      // -------------------------------------------------------------
      if (step === 'verify') {
        return (
          <div className="flex-grow flex flex-col lg:flex-row min-h-screen">
            
            {/* Left Brand Panel: Lacoste Verification After Payment */}
            <div className="w-full lg:w-1/2 bg-[#0A1F44] text-white p-6 sm:p-10 lg:p-16 py-8 sm:py-12 lg:py-16 flex flex-col justify-between">
              
              <div className="my-auto max-w-lg">
                <h2 className="text-3xl sm:text-4xl lg:text-5xl font-serif font-bold text-white tracking-tight leading-[1.15] mb-4">
                  Lacoste Verification After Payment
                </h2>
                <p className="text-blue-100/80 text-xs sm:text-sm lg:text-base leading-relaxed mb-6 sm:mb-8">
                  Welcome to the official Lacoste collection portal for the Department of Computer Science, Takoradi Technical University. Verify your student details to confirm your dues payment and choose your preferred colour and size.
                </p>

                <div className="space-y-3 sm:space-y-4 text-xs sm:text-sm text-blue-100/90 font-normal">
                  <div className="flex items-center gap-3">
                    <div className="w-5 h-5 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center flex-shrink-0">
                      <Icon name="check" className="w-3 h-3 stroke-[3]" />
                    </div>
                    <span>Real-time verification against the paid student register</span>
                  </div>
                  <div className="flex items-center gap-3">
                    <div className="w-5 h-5 rounded-full bg-blue-500/20 text-blue-300 flex items-center justify-center flex-shrink-0">
                      <Icon name="shirt" className="w-3 h-3" />
                    </div>
                    <span>Select your preferred colour (Royal Blue / Classic White) and size (S - XXXL)</span>
                  </div>
                  <div className="flex items-center gap-3">
                    <div className="w-5 h-5 rounded-full bg-indigo-500/20 text-indigo-300 flex items-center justify-center flex-shrink-0">
                      <Icon name="shield-check" className="w-3 h-3" />
                    </div>
                    <span>One-time secure submission per student index number</span>
                  </div>
                </div>
              </div>
            </div>

            {/* Right Interactive Form Area */}
            <div className="w-full lg:w-1/2 bg-white flex flex-col justify-center items-center p-6 sm:p-10 lg:p-16 py-8 sm:py-12 lg:py-16">
              <div className="max-w-md w-full">
                <div className="mb-6 sm:mb-8">
                  <h1 className="text-2xl sm:text-3xl font-serif font-bold text-slate-900 tracking-tight">
                    Student Verification
                  </h1>
                  <p className="text-xs sm:text-sm text-slate-500 mt-1">
                    Enter your full name and index number to continue
                  </p>
                </div>

                {settings && settings.submissionStatus === 'CLOSED' && (
                  <div className="bg-rose-50 border border-rose-200 rounded-xl p-4 mb-6">
                    <div className="flex gap-3">
                      <Icon name="alert-triangle" className="w-5 h-5 text-rose-600 flex-shrink-0" />
                      <div>
                        <h4 className="text-sm font-semibold text-rose-900">Submissions Closed</h4>
                        <p className="text-xs text-rose-700 mt-0.5">
                          Submissions are currently closed. Please contact the ITSU Treasurer for assistance.
                        </p>
                      </div>
                    </div>
                  </div>
                )}

                {errorMessage && (
                  <div className="bg-rose-50 border border-rose-200 rounded-xl p-3.5 mb-5 flex items-start gap-2.5 text-rose-900 text-xs sm:text-sm">
                    <Icon name="alert-circle" className="w-5 h-5 text-rose-600 flex-shrink-0 mt-0.5" />
                    <div>{errorMessage}</div>
                  </div>
                )}

                <form onSubmit={handleVerify} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">
                      Full Name
                    </label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. ANTHONY MACLEAN"
                      value={fullName}
                      onChange={(e) => setFullName(e.target.value.toUpperCase())}
                      className="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 hover:bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#103E8C] focus:border-transparent text-sm uppercase transition text-slate-900 placeholder:text-slate-400"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">
                      Index Number
                    </label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. 0721000001"
                      value={indexNumber}
                      onChange={(e) => setIndexNumber(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 hover:bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#103E8C] focus:border-transparent text-sm uppercase font-mono transition text-slate-900 placeholder:text-slate-400"
                    />
                  </div>

                  <div className="pt-2">
                    <button
                      type="submit"
                      disabled={isLoading || (settings && settings.submissionStatus === 'CLOSED')}
                      className="w-full bg-[#103E8C] hover:bg-[#0B2E68] disabled:bg-slate-300 text-white font-medium py-3.5 px-6 rounded-xl shadow-sm transition flex items-center justify-center gap-2 text-sm"
                    >
                      {isLoading ? (
                        <>
                          <Icon name="loader-2" className="w-4 h-4 animate-spin" />
                          <span>Verifying Eligibility...</span>
                        </>
                      ) : (
                        <span>Verify & Continue</span>
                      )}
                    </button>
                  </div>
                </form>

                <div className="mt-8 text-center text-xs text-slate-500 space-y-2">
                  <div>
                    Need assistance?{' '}
                    <button
                      type="button"
                      onClick={() => setShowContactModal(true)}
                      className="text-[#103E8C] font-semibold hover:underline"
                    >
                      CONTACT ITSU TREASURER
                    </button>
                  </div>

                  <div>
                    <button
                      type="button"
                      onClick={onOpenTreasurer}
                      className="text-[#103E8C] font-semibold hover:underline"
                    >
                      Treasurer Login
                    </button>
                  </div>
                </div>
              </div>
            </div>

            {/* Contact Treasurer Popup Modal */}
            <ContactTreasurerModal
              isOpen={showContactModal}
              onClose={() => setShowContactModal(false)}
            />

          </div>
        );
      }

      // -------------------------------------------------------------
      // 2. STEP: SELECTION (FULL-WIDTH STUDIO SHOWCASE - EXACT MATCH TO IMAGE 2)
      // -------------------------------------------------------------
      if (step === 'select') {
        return (
          <div className="flex-grow flex flex-col bg-[#FDFDFD] py-6 sm:py-8 px-4 sm:px-6 lg:px-8 min-h-screen">
            <div className="max-w-5xl mx-auto w-full flex-grow flex flex-col justify-between">
              
              {/* Top Student Details Bar (Locked on Scroll) */}
              <div className="sticky top-3 z-30 bg-white/95 backdrop-blur-md rounded-2xl shadow-sm border border-slate-200/80 p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6 select-none">
                <div className="flex items-center gap-3.5">
                  <div className="w-11 h-11 rounded-2xl bg-[#0A1F44] text-white flex items-center justify-center font-bold text-base uppercase shadow-sm flex-shrink-0">
                    {verifiedStudent.fullName.charAt(0).toUpperCase()}
                  </div>
                  <div>
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className="font-bold text-slate-900 text-base sm:text-lg uppercase tracking-wide">
                        {verifiedStudent.fullName.toUpperCase()}
                      </span>
                      <span
                        title="Verified Paid"
                        aria-label="Verified Paid"
                        className="inline-flex items-center justify-center w-6 h-6 rounded-full bg-emerald-50 border border-emerald-200 text-emerald-600 flex-shrink-0 shadow-2xs"
                      >
                        <Icon name="badge-check" className="w-4 h-4" />
                      </span>
                    </div>
                    <div className="text-xs text-slate-500 font-mono mt-0.5 uppercase">
                      Index: {verifiedStudent.indexNumber}
                    </div>
                  </div>
                </div>
              </div>

              {/* Central Photorealistic Product Showcase with Responsive Layout (Desktop: Floating Studio, Mobile: Structured Flow) */}
              <div className="relative w-full max-w-4xl mx-auto my-auto flex flex-col md:flex-row md:items-center md:justify-center md:min-h-[520px]">
                
                {/* Floating Card 1: COLOR (Top on Mobile, Upper Left Floating on Desktop) */}
                <div className="w-full md:w-auto md:absolute md:top-6 md:left-4 z-20 mb-4 md:mb-0">
                  <div className="bg-white rounded-2xl shadow-[0_8px_30px_rgba(0,0,0,0.06)] border border-slate-100/90 p-4 sm:p-5 w-full md:w-[240px]">
                    <span className="text-[11px] font-bold text-slate-400 uppercase tracking-widest block mb-2.5">
                      COLOR
                    </span>
                    <div className="flex items-center gap-6 sm:gap-4 justify-start">
                      {/* Royal Blue Option */}
                      <button
                        type="button"
                        onClick={() => setSelectedColour('Blue')}
                        className="group flex items-center md:flex-col gap-2.5 md:gap-1.5 focus:outline-none cursor-pointer"
                      >
                        <div className={`w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-[#18396D] transition-all duration-200 flex items-center justify-center ${
                          selectedColour === 'Blue'
                            ? 'ring-2 ring-offset-2 ring-[#18396D] scale-105 shadow-md'
                            : 'hover:scale-105 opacity-80 hover:opacity-100'
                        }`}>
                          {selectedColour === 'Blue' && (
                            <div className="w-4 h-4 sm:w-5 sm:h-5 rounded-full border-2 border-white"></div>
                          )}
                        </div>
                        <span className={`text-xs sm:text-[11px] font-semibold ${selectedColour === 'Blue' ? 'text-[#18396D]' : 'text-slate-400'}`}>
                          Royal Blue
                        </span>
                      </button>

                      {/* Classic White Option */}
                      <button

                        onClick={() => setSelectedColour('White')}
                        className="group flex items-center md:flex-col gap-2.5 md:gap-1.5 focus:outline-none cursor-pointer"
                      >
                        <div className={`w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-white border-2 border-slate-300 transition-all duration-200 flex items-center justify-center ${
                          selectedColour === 'White'
                            ? 'ring-2 ring-offset-2 ring-slate-800 scale-105 shadow-md'
                            : 'hover:scale-105 opacity-80 hover:opacity-100'
                        }`}>
                          {selectedColour === 'White' && (
                            <div className="w-4 h-4 sm:w-5 sm:h-5 rounded-full border-2 border-slate-800"></div>
                          )}
                        </div>
                        <span className={`text-xs sm:text-[11px] font-semibold ${selectedColour === 'White' ? 'text-slate-900' : 'text-slate-400'}`}>
                          Classic White
                        </span>
                      </button>
                    </div>
                  </div>
                </div>

                {/* Central Photorealistic Polo Shirt Studio with Animated Front/Back View Controls */}
                <div
                  className="relative z-10 max-w-[270px] sm:max-w-[390px] md:max-w-[440px] w-full mx-auto flex flex-col items-center justify-center transition-all duration-500 py-1 sm:py-2"

                  onMouseLeave={() => setIsHoveringPolo(false)}
                >
                  <LacostePoloStudio

                    view={selectedView}
                    className="w-full h-[250px] sm:h-[330px] md:h-[370px] rounded-2xl"
                  />

                  {/* Front View / Back View / Auto-Animate Interactive Toggle (High Z-Index, Zero Clipping) */}
                  <div className="relative z-30 flex items-center gap-1 mt-3 bg-white p-1.5 rounded-full border border-slate-200/90 shadow-md select-none">
                    <button
                      type="button"
                      onClick={() => {
                        setSelectedView('front');
                        setAutoRotate(false);
                      }}
                      className={`px-3.5 py-1.5 text-xs font-semibold rounded-full transition-all duration-150 flex items-center gap-1.5 cursor-pointer ${
                        selectedView === 'front'
                          ? 'bg-[#103E8C] text-white shadow-xs'

                      }`}
                    >
                      <span>Front Crest</span>
                    </button>
                    <button
                      type="button"
                      onClick={() => {

                        setAutoRotate(false);
                      }}

    function ChangePasswordModal({ isOpen, onClose, sessionToken, isForced, onPasswordChanged, onNotify }) {

    // ==========================================
    // COMPONENT: Add Pre-Ordered Student(s) Modal (Single + Bulk Paste + Excel/CSV Upload)
    // ==========================================
    function AddStudentModal({ isOpen, onClose, sessionToken, onStudentAdded, onNotify }) {
      const [mode, setMode] = useState('bulk'); // 'bulk' | 'single'
      const [fullName, setFullName] = useState('');
      const [indexNumber, setIndexNumber] = useState('');
      const [bulkText, setBulkText] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [error, setError] = useState('');
      const fileInputRef = useRef(null);

      // Smart parser for bulk text (handles Excel tab-separated, CSV comma-separated, hyphen, or space-separated lines)
      const parsedBulkList = useMemo(() => {
        if (!bulkText.trim()) return [];
        const lines = bulkText.split(/\r?\n/);
        const results = [];

        lines.forEach(rawLine => {
          // Strip leading numbering like "1." or "1)" or "•"
          let line = rawLine.trim().replace(/^\d+[\.\)\-\s]+\s*/, '').replace(/^[•\-\*]\s*/, '').trim();
          if (!line) return;

          let namePart = '';
          let indexPart = '';

          // Split by Tab, Comma, Semicolon, Pipe, or " - "
          const delimiters = /\t|,|;|\||\s+-\s+/;
          if (delimiters.test(line)) {
            const parts = line.split(delimiters).map(s => s.trim().replace(/^["']|["']$/g, '')).filter(Boolean);
            if (parts.length >= 2) {
              // Ignore header row if both look like headers
              const lower0 = parts[0].toLowerCase();
              const lower1 = parts[1].toLowerCase();
              if ((lower0.includes('name') || lower0.includes('index')) && (lower1.includes('name') || lower1.includes('index'))) {
                return;
              }
              // Detect which column has digits (Index Number) vs letters (Full Name)
              const hasDigits0 = /\d{3,}/.test(parts[0]);
              const hasDigits1 = /\d{3,}/.test(parts[1]);
              if (hasDigits0 && !hasDigits1) {
                indexPart = parts[0];
                namePart = parts.slice(1).join(' ');
              } else {
                namePart = parts[0];
                indexPart = parts[1];
              }
            }
          } else {
            // Space-separated fallback: e.g. "Kwabena Mensah 0721000099" or "0721000099 Kwabena Mensah"
            const tokens = line.split(/\s+/);
            if (tokens.length >= 2) {
              if (/\d{3,}/.test(tokens[tokens.length - 1])) {
                indexPart = tokens[tokens.length - 1];
                namePart = tokens.slice(0, -1).join(' ');
              } else if (/\d{3,}/.test(tokens[0])) {
                indexPart = tokens[0];
                namePart = tokens.slice(1).join(' ');
              }
            }
          }

          if (namePart && indexPart) {
            results.push({
              fullName: namePart.trim().toUpperCase(),
              indexNumber: indexPart.trim().toUpperCase()
            });
          }
        });

        return results;
      }, [bulkText]);

      if (!isOpen) return null;

      // Handle Excel (.xlsx/.xls) or CSV file upload into bulk list
      const handleFileUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        setError('');

        const reader = new FileReader();
        if (file.name.match(/\.(xlsx|xls)$/i) && window.XLSX) {
          reader.onload = (evt) => {
            try {
              const data = new Uint8Array(evt.target.result);
              const wb = window.XLSX.read(data, { type: 'array' });
              const firstSheet = wb.Sheets[wb.SheetNames[0]];
              const rows = window.XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: '' });
              const lines = [];
              rows.forEach(r => {
                const nonEmpty = r.map(c => String(c ?? '').trim()).filter(Boolean);
                if (nonEmpty.length >= 2) {
                  lines.push(`${nonEmpty[0]}\t${nonEmpty[1]}`);
                }
              });
              setBulkText(prev => (prev ? prev + '\n' : '') + lines.join('\n'));
            } catch (err) {
              setError('Could not read Excel file: ' + err.message);
            }
          };
          reader.readAsArrayBuffer(file);
        } else {
          reader.onload = (evt) => {
            const text = String(evt.target.result || '');
            setBulkText(prev => (prev ? prev + '\n' : '') + text.trim());
          };
          reader.readAsText(file);
        }
        e.target.value = '';
      };

      const handleAddSingle = async (e) => {
        e.preventDefault();
        setError('');
        setIsLoading(true);

        try {
          const res = await ApiService.call('addPaidStudent', sessionToken, {
            fullName: fullName.trim().toUpperCase(),
            indexNumber: indexNumber.trim().toUpperCase(),
            paymentStatus: 'PAID'
          });

          if (res.success) {
            onNotify({ message: 'Student added to register successfully!', type: 'success' });
            setFullName('');
            setIndexNumber('');
            onStudentAdded();
            onClose();
          } else {
            setError(res.message || 'Failed to add student.');
          }
        } catch (err) {
          setError(err.message || 'Failed to add student.');
        } finally {
          setIsLoading(false);
        }
      };

      const handleAddBulk = async (e) => {
        e.preventDefault();
        if (parsedBulkList.length === 0) {
          setError('Please paste or upload at least one line with Full Name and Index Number.');
          return;
        }
        setError('');
        setIsLoading(true);

        try {
          const res = await ApiService.call('bulkAddPaidStudents', sessionToken, parsedBulkList);
          if (res.success) {
            onNotify({
              message: `Added ${res.added} student(s) to register${res.skipped ? ` (${res.skipped} duplicate skipped)` : ''}!`,
              type: 'success'
            });
            setBulkText('');
            onStudentAdded();
            onClose();
          } else {
            setError(res.message || 'Bulk import failed.');
          }
        } catch (err) {
          setError(err.message || 'Bulk import failed.');
        } finally {
          setIsLoading(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl border border-slate-200 shadow-2xl max-w-lg w-full p-6 relative">
            <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
              <Icon name="x" className="w-5 h-5" />
            </button>

            <h3 className="text-base font-bold text-slate-900 mb-0.5">Add Pre-Ordered Students</h3>
            <p className="text-xs text-slate-500 mb-4">
              Add students by Full Name and Index Number so they can select their Lacoste colour and size.
            </p>

            {/* Mode Switcher: Bulk Import vs Single Student */}
            <div className="grid grid-cols-2 gap-1.5 bg-slate-100 p-1 rounded-xl mb-4 text-xs font-semibold">
              <button
                type="button"
                onClick={() => { setMode('bulk'); setError(''); }}
                className={`py-2 rounded-lg transition flex items-center justify-center gap-1.5 ${
                  mode === 'bulk' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-500 hover:text-slate-800'
                }`}
              >
                <Icon name="users" className="w-3.5 h-3.5" />
                <span>Bulk List / Excel Import</span>
              </button>
              <button
                type="button"
                onClick={() => { setMode('single'); setError(''); }}
                className={`py-2 rounded-lg transition flex items-center justify-center gap-1.5 ${
                  mode === 'single' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-500 hover:text-slate-800'
                }`}
              >
                <Icon name="user-plus" className="w-3.5 h-3.5" />
                <span>Single Student</span>
              </button>
            </div>

            {error && (
              <div className="bg-rose-50 border border-rose-200 rounded-lg p-2.5 mb-4 text-xs text-rose-800">
                {error}
              </div>
            )}

            {mode === 'bulk' ? (
              <form onSubmit={handleAddBulk} className="space-y-3">
                <div className="flex items-center justify-between">
                  <label className="block text-xs font-semibold text-slate-700">
                    Paste List (Name &amp; Index Number)
                  </label>
                  <div>
                    <input
                      ref={fileInputRef}
                      type="file"
                      accept=".xlsx,.xls,.csv,.txt"
                      onChange={handleFileUpload}
                      className="hidden"
                    />
                    <button
                      type="button"
                      onClick={() => fileInputRef.current && fileInputRef.current.click()}
                      className="text-[11px] font-semibold text-primary-800 hover:text-primary-900 bg-primary-50 hover:bg-primary-100 border border-primary-200 px-2.5 py-1 rounded-md flex items-center gap-1 transition"
                    >
                      <Icon name="upload" className="w-3 h-3" />
                      <span>Upload Excel / CSV</span>
                    </button>
                  </div>
                </div>

                <textarea
                  rows={5}
                  placeholder={"Paste from Excel, WhatsApp, or type one per line:\nANTHONY MACLEAN, 0721000001\nKOFI MENSAH, 0721000002\nAMA SERWAA 0721000003"}
                  value={bulkText}
                  onChange={(e) => setBulkText(e.target.value)}
                  className="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-xs font-mono focus:ring-2 focus:ring-primary-500 focus:outline-none"
                />

                {/* Live Parsed Preview */}
                <div className="bg-slate-50 border border-slate-200 rounded-xl p-3">
                  <div className="flex items-center justify-between text-[11px] font-semibold text-slate-600 mb-1.5">
                    <span>Detected Students Ready to Import:</span>
                    <span className="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold">
                      {parsedBulkList.length}
                    </span>
                  </div>
                  {parsedBulkList.length > 0 ? (
                    <div className="max-h-28 overflow-y-auto divide-y divide-slate-200/70 text-[11px]">
                      {parsedBulkList.slice(0, 25).map((item, i) => (
                        <div key={i} className="py-1 flex items-center justify-between gap-2">
                          <span className="font-semibold text-slate-800 truncate">{i + 1}. {item.fullName}</span>
                          <span className="font-mono text-slate-600 shrink-0">{item.indexNumber}</span>
                        </div>
                      ))}
                      {parsedBulkList.length > 25 && (
                        <div className="py-1 text-center text-slate-400 italic">
                          + {parsedBulkList.length - 25} more students...
                        </div>
                      )}
                    </div>
                  ) : (
                    <p className="text-[11px] text-slate-400">
                      Supports comma, tab (copied directly from Excel columns), hyphen, or space-separated Name + Index Number.
                    </p>
                  )}
                </div>

                <div className="pt-2 flex justify-end gap-2">
                  <button
                    type="button"
                    onClick={onClose}
                    className="px-3 py-2 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    disabled={isLoading || parsedBulkList.length === 0}
                    className="px-4 py-2 text-xs font-semibold text-white bg-primary-800 hover:bg-primary-900 disabled:bg-slate-300 rounded-lg flex items-center gap-1.5"
                  >
                    <Icon name="check" className="w-3.5 h-3.5" />
                    <span>{isLoading ? 'Importing...' : `Import ${parsedBulkList.length || ''} Student${parsedBulkList.length === 1 ? '' : 's'}`}</span>
                  </button>
                </div>
              </form>
            ) : (
              <form onSubmit={handleAddSingle} className="space-y-3">
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Full Name</label>
                  <input
                    type="text"
                    required
                    placeholder="e.g. KWABENA MENSAH"
                    value={fullName}
                    onChange={(e) => setFullName(e.target.value)}
                    className="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm uppercase focus:ring-2 focus:ring-primary-500 focus:outline-none"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Index Number</label>
                  <input
                    type="text"
                    required
                    placeholder="e.g. 0721000099"
                    value={indexNumber}
                    onChange={(e) => setIndexNumber(e.target.value)}
                    className="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-primary-500 focus:outline-none uppercase font-mono"
                  />
                </div>

                <div className="pt-2 flex justify-end gap-2">
                  <button
                    type="button"
                    onClick={onClose}
                    className="px-3 py-2 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg"
                  >
                    Cancel
                  </button>
                  <button
                    type="submit"
                    disabled={isLoading}
                    className="px-4 py-2 text-xs font-semibold text-white bg-primary-800 hover:bg-primary-900 rounded-lg flex items-center gap-1.5"
                  >
                    {isLoading ? 'Adding...' : 'Add Student'}
                  </button>
                </div>
              </form>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // COMPONENT: Correct Selection Modal
    // ==========================================
    function CorrectSelectionModal({ isOpen, onClose, student, sessionToken, onSelectionUpdated, onNotify }) {
      const [editName, setEditName] = useState('');
      const [editIndex, setEditIndex] = useState('');
      const [colour, setColour] = useState('Blue');
      const [size, setSize] = useState('L');
      const [reason, setReason] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [error, setError] = useState('');

      useEffect(() => {
        if (student) {
          setEditName(student.fullName || '');
          setEditIndex(student.indexNumber || '');
          if (student.selectedColour && student.selectedColour !== '-') setColour(student.selectedColour);
          if (student.selectedSize && student.selectedSize !== '-') setSize(student.selectedSize);
        }
      }, [student]);

      if (!isOpen || !student) return null;

      const handleUpdate = async (e) => {
        e.preventDefault();
        setError('');
        setIsLoading(true);

        try {
          let targetIdx = student.indexNumber;
          if (editName.trim().toUpperCase() !== String(student.fullName || '').trim().toUpperCase() ||
              editIndex.trim().toUpperCase() !== String(student.indexNumber || '').trim().toUpperCase()) {
            await ApiService.call('updatePaidStudent', sessionToken, student.indexNumber, {
              fullName: editName.trim().toUpperCase(),
              indexNumber: editIndex.trim().toUpperCase()
            });
            targetIdx = editIndex.trim().toUpperCase();
          }

          const res = await ApiService.call('updateStudentSelection', sessionToken, targetIdx, {
            colour: colour,
            size: size,
            reason: reason || 'Treasurer Manual Update'
          });

          if (res.success) {
            onNotify({ message: 'Student record & selection updated!', type: 'success' });
            onSelectionUpdated();
            onClose();
          } else {
            setError(res.message || 'Failed to update selection.');
          }
        } catch (err) {
          setError(err.message || 'Failed to update selection.');
        } finally {
          setIsLoading(false);
        }

        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-xl border border-slate-200 shadow-2xl max-w-md w-full p-6 relative">

            {error && (
              <div className="bg-rose-50 border border-rose-200 rounded-lg p-2.5 mb-3 text-xs text-rose-800">
                {error}
              </div>
            )}

            <form onSubmit={handleUpdate} className="space-y-3">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Full Name</label>
                  <input
                    type="text"
                    required
                    value={editName}
                    onChange={(e) => setEditName(e.target.value.toUpperCase())}
                    className="w-full px-3 py-2 rounded-lg border border-slate-300 text-xs uppercase font-semibold focus:ring-2 focus:ring-primary-500 focus:outline-none"
                  />

                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-2.5">
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Colour</label>
                  <select
                    value={colour}
                    onChange={(e) => setColour(e.target.value)}
                    className="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-primary-500 focus:outline-none"
                  >
                    <option value="Blue">Blue</option>

                <input

                  onChange={(e) => setReason(e.target.value)}
                  className="w-full px-3 py-2 rounded-lg border border-slate-300 text-xs focus:ring-2 focus:ring-primary-500 focus:outline-none"

                >
