  <script>
    (function() {
      // Local Database Seed for Standalone Preview
      const DB_KEY = 'itsu_mock_db_v1';
      function getDb() {
        const stored = localStorage.getItem(DB_KEY);
        if (stored) {
          try { return JSON.parse(stored); } catch (e) {}
        }
        const initial = {
          settings: {
            portalName: 'ITSU Lacoste Verification & Collection Portal',
            submissionStatus: 'OPEN',
            availableColours: ['Blue', 'White'],
            availableSizes: ['S', 'M', 'L', 'XL', 'XXL', 'XXXL'],
            maxSubmissions: 1
          },
          students: [
            { fullName: 'Anthony Maclean', indexNumber: '0721000001', paymentStatus: 'PAID', paymentReference: 'REF-CS-2026-001', dateAdded: '2026-11-01' },
            { fullName: 'Kofi Mensah', indexNumber: '0721000002', paymentStatus: 'PAID', paymentReference: 'REF-CS-2026-002', dateAdded: '2026-11-01' },
            { fullName: 'Ama Serwaa', indexNumber: '0721000003', paymentStatus: 'PAID', paymentReference: 'REF-CS-2026-003', dateAdded: '2026-11-01' },
            { fullName: 'Kwame Owusu', indexNumber: '0721000004', paymentStatus: 'PAID', paymentReference: 'REF-CS-2026-004', dateAdded: '2026-11-01' },
            { fullName: 'Abena Osei', indexNumber: '0721000005', paymentStatus: 'PAID', paymentReference: 'REF-CS-2026-005', dateAdded: '2026-11-01' },
            { fullName: 'Yaw Boakye', indexNumber: '0721000006', paymentStatus: 'PAID', paymentReference: 'REF-CS-2026-006', dateAdded: '2026-11-01' },
            { fullName: 'Akosua Boateng', indexNumber: '0721000007', paymentStatus: 'PAID', paymentReference: 'REF-CS-2026-007', dateAdded: '2026-11-01' },
            { fullName: 'Emmanuel Frimpong', indexNumber: '0721000008', paymentStatus: 'PAID', paymentReference: 'REF-CS-2026-008', dateAdded: '2026-11-01' },
            { fullName: 'Priscilla Darko', indexNumber: '0721000009', paymentStatus: 'PAID', paymentReference: 'REF-CS-2026-009', dateAdded: '2026-11-01' },
            { fullName: 'Samuel Appiah', indexNumber: '0721000010', paymentStatus: 'PAID', paymentReference: 'REF-CS-2026-010', dateAdded: '2026-11-01' },
            { fullName: 'Grace Addo', indexNumber: '0721000011', paymentStatus: 'PAID', paymentReference: 'REF-CS-2026-011', dateAdded: '2026-11-01' },
            { fullName: 'Michael Quaye', indexNumber: '0721000012', paymentStatus: 'PAID', paymentReference: 'REF-CS-2026-012', dateAdded: '2026-11-01' },
            { fullName: 'Benjamin Cudjoe', indexNumber: '0721000016', paymentStatus: 'UNPAID', paymentReference: 'PENDING', dateAdded: '2026-11-02' }
          ],
          selections: [
            { submissionId: 'ITSU-LAC-A1B2C3', fullName: 'Anthony Maclean', indexNumber: '0721000001', selectedColour: 'Blue', selectedSize: 'L', submittedAt: '2026-11-02 10:14:00', status: 'CONFIRMED' },
            { submissionId: 'ITSU-LAC-D4E5F6', fullName: 'Kofi Mensah', indexNumber: '0721000002', selectedColour: 'White', selectedSize: 'XL', submittedAt: '2026-11-02 11:20:00', status: 'CONFIRMED' },
            { submissionId: 'ITSU-LAC-G7H8I9', fullName: 'Ama Serwaa', indexNumber: '0721000003', selectedColour: 'Blue', selectedSize: 'M', submittedAt: '2026-11-02 12:45:00', status: 'CONFIRMED' }
          ],
          admin: {
            email: 'anthonymaclean100@gmail.com',
            password: 'ITSU@Treasurer2026!',
            mustChangePassword: true
          },
          auditLogs: [
            { logId: 'LOG-INIT', timestamp: new Date().toISOString(), user: 'SYSTEM', action: 'SYSTEM_INITIALIZED', details: 'Database initialized', status: 'SUCCESS' }
          ]
        };
        localStorage.setItem(DB_KEY, JSON.stringify(initial));
        return initial;
      }

      function saveDb(db) {
        localStorage.setItem(DB_KEY, JSON.stringify(db));
      }

      window.MockBackend = {
        getPortalSettings() {
          const db = getDb();
          return db.settings;
        },

        verifyStudent(fullName, indexNumber) {
          const db = getDb();
          const normIdx = String(indexNumber || '').trim().toUpperCase();
          const normName = String(fullName || '').trim().toLowerCase();

          if (db.settings.submissionStatus !== 'OPEN') {
            return { verified: false, isClosed: true, message: 'Submissions are currently closed. Please contact the ITSU Treasurer for assistance.' };
          }

          const existing = db.selections.find(s => s.indexNumber.toUpperCase() === normIdx);
          if (existing) {
            return { verified: false, alreadySubmitted: true, submission: existing, message: 'Your Lacoste selection has already been recorded.' };
          }

          const student = db.students.find(s => s.indexNumber.toUpperCase() === normIdx);
          if (!student || student.paymentStatus !== 'PAID') {
            return { verified: false, message: "We couldn't verify your details. Please check your name and index number or contact the ITSU Treasurer." };
          }

          // Check name contains or matches
          if (!student.fullName.toLowerCase().includes(normName) && !normName.includes(student.fullName.toLowerCase())) {
            return { verified: false, message: "We couldn't verify your details. Please check your name and index number or contact the ITSU Treasurer." };
          }

          return {
            verified: true,
            student: { fullName: student.fullName, indexNumber: student.indexNumber },
            token: btoa(`${student.indexNumber}|${student.fullName}|${Date.now() + 1800000}`),
            availableColours: db.settings.availableColours,
            availableSizes: db.settings.availableSizes
          };
        },

        submitSelection(token, colour, size) {
          const db = getDb();
          let payload;
          try { payload = atob(token).split('|'); } catch(e) { throw new Error('Invalid token'); }
          const [indexNumber, fullName] = payload;

          if (db.settings.submissionStatus !== 'OPEN') {
            throw new Error('Submissions are closed.');
          }

          const existing = db.selections.find(s => s.indexNumber === indexNumber);
          if (existing) {
            throw new Error('Your Lacoste selection has already been recorded.');
          }

          const subId = 'ITSU-LAC-' + Math.random().toString(36).substring(2, 8).toUpperCase();
          const submittedAt = new Date().toISOString().replace('T', ' ').substring(0, 19);

          const newSub = {
            submissionId: subId,
            fullName: fullName,
            indexNumber: indexNumber,
            selectedColour: colour,
            selectedSize: size,
            submittedAt: submittedAt,
            status: 'CONFIRMED'
          };
          db.selections.push(newSub);
          db.auditLogs.unshift({
            logId: 'LOG-' + Math.random().toString(36).substring(2, 7).toUpperCase(),
            timestamp: new Date().toISOString(),
            user: indexNumber,
            action: 'SUBMISSION_CONFIRMED',
            details: JSON.stringify({ colour, size, subId }),
            status: 'SUCCESS'
          });
          saveDb(db);

          return {
            success: true,
            submissionId: subId,
            fullName: fullName,
            indexNumber: indexNumber,
            selectedColour: colour,
            selectedSize: size,
            submittedAt: submittedAt
          };
        },

        adminLogin(email, password) {
          const db = getDb();
          const normEmail = (email || '').trim().toLowerCase();
          if (normEmail !== db.admin.email.toLowerCase() || password !== db.admin.password) {
            throw new Error('Invalid email or password.');
          }
          const token = 'MOCK-SESSION-' + Math.random().toString(36).substring(2);
          db.auditLogs.unshift({
            logId: 'LOG-' + Math.random().toString(36).substring(2, 7).toUpperCase(),
            timestamp: new Date().toISOString(),
            user: normEmail,
            action: 'LOGIN_SUCCESS',
            details: 'Treasurer authenticated',
            status: 'SUCCESS'
          });
          saveDb(db);
          return {
            success: true,
            sessionToken: token,
            email: normEmail,
            mustChangePassword: db.admin.mustChangePassword
          };
        },

        adminLogout(token) {
          return { success: true };
        },

        changeAdminPassword(sessionToken, arg2, arg3) {
          const db = getDb();
          let currentPassword = arg3 !== undefined ? arg2 : null;
          let newPassword = arg3 !== undefined ? arg3 : arg2;
          if (currentPassword && currentPassword !== db.admin.password) {
            throw new Error('Current password is incorrect.');
          }
          db.admin.password = newPassword;
          db.admin.mustChangePassword = false;
          db.auditLogs.unshift({
            logId: 'LOG-PWD',
            timestamp: new Date().toISOString(),
            user: db.admin.email,
            action: 'PASSWORD_CHANGED',
            details: 'Treasurer password updated',
            status: 'SUCCESS'
          });
          saveDb(db);
          return { success: true };
        },

        getDashboardStats(sessionToken) {
          const db = getDb();
          const paidStudents = db.students.filter(s => s.paymentStatus === 'PAID');
          const totalPaid = paidStudents.length;
          const totalSub = db.selections.length;
          const pending = Math.max(0, totalPaid - totalSub);
          const completion = totalPaid > 0 ? Math.round((totalSub / totalPaid) * 100) : 0;

          let blueCount = 0;
          let whiteCount = 0;
          const sizeCounts = { S: 0, M: 0, L: 0, XL: 0, XXL: 0, XXXL: 0 };
          const matrix = {
            S: { Blue: 0, White: 0, Total: 0 },
            M: { Blue: 0, White: 0, Total: 0 },
            L: { Blue: 0, White: 0, Total: 0 },
            XL: { Blue: 0, White: 0, Total: 0 },
            XXL: { Blue: 0, White: 0, Total: 0 },
            XXXL: { Blue: 0, White: 0, Total: 0 }
          };

          db.selections.forEach(s => {
            const c = (s.selectedColour || '').toLowerCase();
            const sz = (s.selectedSize || '').toUpperCase();
            if (c === 'blue') blueCount++;
            if (c === 'white') whiteCount++;
            if (sizeCounts[sz] !== undefined) sizeCounts[sz]++;
            if (matrix[sz]) {
              if (c === 'blue') matrix[sz].Blue++;
              if (c === 'white') matrix[sz].White++;
              matrix[sz].Total++;
            }
          });

          return {
            overview: {
              totalPaidStudents: totalPaid,
              totalSubmissions: totalSub,
              pendingStudents: pending,
              completionPercentage: completion,
              submissionStatus: db.settings.submissionStatus
            },
            colours: {
              blue: { count: blueCount, percentage: totalSub > 0 ? Math.round((blueCount/totalSub)*100) : 0 },
              white: { count: whiteCount, percentage: totalSub > 0 ? Math.round((whiteCount/totalSub)*100) : 0 }
            },
            sizes: sizeCounts,
            matrix: matrix,
            recentSubmissions: db.selections.slice(-10).reverse().map(s => ({
              submissionId: s.submissionId,
              fullName: s.fullName,
              indexNumber: s.indexNumber,
              colour: s.selectedColour,
              size: s.selectedSize,
              submittedAt: s.submittedAt
            }))
          };
        },

        getStudentSelections(sessionToken, filters) {
          const db = getDb();
          const selMap = new Map();
          db.selections.forEach(s => selMap.set(s.indexNumber, s));

          let list = db.students.map(st => {
            const sel = selMap.get(st.indexNumber);
            return {
              fullName: st.fullName,
              indexNumber: st.indexNumber,
              paymentStatus: st.paymentStatus,
              paymentReference: st.paymentReference,
              submissionId: sel ? sel.submissionId : '-',
              selectedColour: sel ? sel.selectedColour : '-',
              selectedSize: sel ? sel.selectedSize : '-',
              submittedAt: sel ? sel.submittedAt : '-',
              submissionStatus: sel ? 'Submitted' : 'Pending'
            };
          });

          if (filters && filters.search) {
            const q = filters.search.toLowerCase();
            list = list.filter(r => r.fullName.toLowerCase().includes(q) || r.indexNumber.toLowerCase().includes(q));
          }
          if (filters && filters.colour && filters.colour !== 'ALL') {
            list = list.filter(r => r.selectedColour.toLowerCase() === filters.colour.toLowerCase());
          }
          if (filters && filters.size && filters.size !== 'ALL') {
            list = list.filter(r => r.selectedSize.toUpperCase() === filters.size.toUpperCase());
          }
          if (filters && filters.status && filters.status !== 'ALL') {
            list = list.filter(r => r.submissionStatus.toLowerCase() === filters.status.toLowerCase());
          }
          return list;
        },

        getPendingStudents(sessionToken) {
          const db = getDb();
          const subSet = new Set(db.selections.map(s => s.indexNumber));
          return db.students
            .filter(st => st.paymentStatus === 'PAID' && !subSet.has(st.indexNumber))
            .map(st => ({
              fullName: st.fullName,
              indexNumber: st.indexNumber,
              paymentStatus: st.paymentStatus,
              paymentReference: st.paymentReference,
              selectionStatus: 'Pending'
            }));
        },

        addPaidStudent(sessionToken, studentData) {
          const db = getDb();
          const exists = db.students.some(s => s.indexNumber === studentData.indexNumber);
          if (exists) throw new Error('Student index number already registered.');
          db.students.push({
            fullName: studentData.fullName,
            indexNumber: studentData.indexNumber,
            paymentStatus: 'PAID',
            paymentReference: studentData.paymentReference || 'MANUAL-REF',
            dateAdded: new Date().toISOString().split('T')[0]
          });
          saveDb(db);
          return { success: true };
        },

        updateStudentSelection(sessionToken, indexNumber, selection) {
          const db = getDb();
          let sel = db.selections.find(s => s.indexNumber === indexNumber);
          if (sel) {
            sel.selectedColour = selection.colour;
            sel.selectedSize = selection.size;
            sel.status = 'CORRECTED';
          } else {
            const st = db.students.find(s => s.indexNumber === indexNumber);
            db.selections.push({
              submissionId: 'ITSU-LAC-ADM-' + Math.random().toString(36).substring(2, 6).toUpperCase(),
              fullName: st ? st.fullName : 'Student',
              indexNumber: indexNumber,
              selectedColour: selection.colour,
              selectedSize: selection.size,
              submittedAt: new Date().toISOString(),
              status: 'CONFIRMED (Admin)'
            });
          }
          saveDb(db);
          return { success: true };
        },

        deleteStudentSelection(sessionToken, indexNumber, reason) {
          const db = getDb();
          const idx = db.selections.findIndex(s => s.indexNumber === indexNumber);
          if (idx !== -1) {
            db.selections.splice(idx, 1);
            saveDb(db);
          }
          return { success: true };
        },

        setSubmissionStatus(sessionToken, status) {
          const db = getDb();
          db.settings.submissionStatus = status;
          saveDb(db);
          return { success: true, submissionStatus: status };
        },

        getAuditLogs(sessionToken) {
          const db = getDb();
          return db.auditLogs;
        },

        exportReport(sessionToken, reportType, format) {
          const db = getDb();
          const sel = db.selections;
          return {
            reportType: reportType,
            title: 'Report: ' + reportType,
            institution: 'Takoradi Technical University',
            department: 'Department of Computer Science',
            union: 'Information Technology Students Union (ITSU)',
            generatedAt: new Date().toISOString(),
            generatedBy: db.admin.email,
            summary: { 'Total Records': sel.length },
            headers: ['#', 'Submission ID', 'Full Name', 'Index Number', 'Colour', 'Size', 'Date'],
            rows: sel.map((s, idx) => [idx + 1, s.submissionId, s.fullName, s.indexNumber, s.selectedColour, s.selectedSize, s.submittedAt])
          };
        }
      };
    })();
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- ICONS HELPER ---
    // Safely render Lucide icon SVG via DOM helper
    function Icon({ name, className = "w-5 h-5", size = 20 }) {
      const spanRef = useRef(null);
      useEffect(() => {
        if (window.lucide && spanRef.current) {
          spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
          window.lucide.createIcons({
            attrs: { class: className },
            nameAttr: 'data-lucide',
            root: spanRef.current
          });
        }
      }, [name, className]);
      return <span ref={spanRef} className="inline-flex items-center justify-center align-middle" />;
    }

    // --- API SERVICE (Google Apps Script / Mock Bridge) ---
    const ApiService = {
      isAppsScript: typeof google !== 'undefined' && google.script && google.script.run,

      call(funcName, ...args) {
        return new Promise((resolve, reject) => {
          if (this.isAppsScript) {
            google.script.run
              .withSuccessHandler(res => resolve(res))
              .withFailureHandler(err => reject(err instanceof Error ? err : new Error(err.message || String(err))))
              [funcName](...args);
          } else {
            // Local simulation adapter for standalone preview
            if (window.MockBackend && typeof window.MockBackend[funcName] === 'function') {
              setTimeout(() => {
                try {
                  const res = window.MockBackend[funcName](...args);
                  resolve(res);
                } catch (e) {
                  reject(e);
                }
              }, 300); // 300ms realistic network latency
            } else {
              reject(new Error(`Function ${funcName} not found.`));
            }
          }
        });
      }
    };

    // --- LOCAL STORAGE PERSISTENCE FOR SESSION ---
    const SESSION_STORAGE_KEY = 'itsu_treasurer_session';

    // ==========================================
    // COMPONENT: Toast Notifications
    // ==========================================
    function Toast({ toast, onClose }) {
      if (!toast) return null;
      const isError = toast.type === 'error';
      const isSuccess = toast.type === 'success';

      return (
        <div className={`fixed bottom-5 right-5 z-50 flex items-center gap-3 px-4 py-3 rounded-lg shadow-lg border text-sm transition-all duration-300 ${
          isError 
            ? 'bg-red-50 border-red-200 text-red-800' 
            : isSuccess 
              ? 'bg-emerald-50 border-emerald-200 text-emerald-800'
              : 'bg-slate-900 border-slate-800 text-white'
        }`}>
          <Icon name={isError ? "alert-circle" : isSuccess ? "check-circle-2" : "info"} className="w-5 h-5 flex-shrink-0" />
          <span className="font-medium">{toast.message}</span>
          <button onClick={onClose} className="ml-2 text-slate-400 hover:text-slate-600 focus:outline-none">
            <Icon name="x" className="w-4 h-4" />
          </button>
        </div>
      );
    }

    // ==========================================
    // COMPONENT: Student Portal Flow
    // ==========================================
    function StudentPortal({ settings, onNotify, onOpenTreasurer }) {
      const [step, setStep] = useState('verify'); // 'verify' | 'select' | 'review' | 'confirmed' | 'already_submitted'
      const [fullName, setFullName] = useState('');
      const [indexNumber, setIndexNumber] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [errorMessage, setErrorMessage] = useState('');
      const [showContactModal, setShowContactModal] = useState(false);
      
      const [verifiedStudent, setVerifiedStudent] = useState(null);
      const [studentToken, setStudentToken] = useState('');
      const [selectedColour, setSelectedColour] = useState('');
      const [selectedSize, setSelectedSize] = useState('');
      const [submissionResult, setSubmissionResult] = useState(null);
      const [alreadySubmittedData, setAlreadySubmittedData] = useState(null);

      // Handle Verification
      const handleVerify = async (e) => {
        e.preventDefault();
        setErrorMessage('');
        
        if (!fullName.trim() || !indexNumber.trim()) {
          setErrorMessage('Please enter both your full name and index number.');
          return;
        }

        setIsLoading(true);
        try {
          const res = await ApiService.call('verifyStudent', fullName.trim(), indexNumber.trim());
          if (res.verified) {
            setVerifiedStudent(res.student);
            setStudentToken(res.token);
            if (!selectedColour) setSelectedColour('Blue');
            setStep('select');
          } else if (res.alreadySubmitted) {
            setAlreadySubmittedData(res.submission);
            setStep('already_submitted');
          } else {
            setErrorMessage(res.message || "We couldn't verify your details. Please check your name and index number or contact the ITSU Treasurer.");
          }
        } catch (err) {
          setErrorMessage(err.message || "An unexpected error occurred. Please try again.");
        } finally {
          setIsLoading(false);
        }
      };

      // Handle Submission
      const handleSubmit = async () => {
        if (!selectedColour || !selectedSize) {
          onNotify({ message: 'Please select both a colour and size.', type: 'error' });
          return;
        }

        setIsLoading(true);
        try {
          const res = await ApiService.call('submitSelection', studentToken, selectedColour, selectedSize);
          if (res.success) {
            setSubmissionResult(res);
            setStep('confirmed');
            onNotify({ message: 'Lacoste selection submitted successfully!', type: 'success' });
          } else {
            onNotify({ message: res.message || 'Submission failed.', type: 'error' });
          }
        } catch (err) {
          onNotify({ message: err.message || 'Error saving your selection.', type: 'error' });
        } finally {
          setIsLoading(false);
        }
      };

      // Reset
      const handleStartOver = () => {
        setStep('verify');
        setFullName('');
        setIndexNumber('');
        setVerifiedStudent(null);
        setStudentToken('');
        setSelectedColour('');
        setSelectedSize('');
        setSubmissionResult(null);
        setErrorMessage('');
      };

      // -------------------------------------------------------------
      // 1. STEP: VERIFICATION (SPLIT SCREEN - EXACT MATCH TO IMAGE 1)
      // -------------------------------------------------------------
      if (step === 'verify') {
        return (
          <div className="flex-grow flex flex-col lg:flex-row min-h-screen">
            
            {/* Left Brand Panel: Lacoste Verification After Payment */}
            <div className="w-full lg:w-1/2 bg-[#0A1F44] text-white p-6 sm:p-10 lg:p-16 py-8 sm:py-12 lg:py-16 flex flex-col justify-between">
              
              <div className="my-auto max-w-lg">
                <h2 className="text-3xl sm:text-4xl lg:text-5xl font-serif font-bold text-white tracking-tight leading-[1.15] mb-4">
                  Lacoste Verification After Payment
                </h2>
                <p className="text-blue-100/80 text-xs sm:text-sm lg:text-base leading-relaxed mb-6 sm:mb-8">
                  Welcome to the official Lacoste collection portal for the Department of Computer Science, Takoradi Technical University. Verify your student details to confirm your dues payment and choose your preferred colour and size.
                </p>

                <div className="space-y-3 sm:space-y-4 text-xs sm:text-sm text-blue-100/90 font-normal">
                  <div className="flex items-center gap-3">
                    <div className="w-5 h-5 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center flex-shrink-0">
                      <Icon name="check" className="w-3 h-3 stroke-[3]" />
                    </div>
                    <span>Real-time verification against the paid student register</span>
                  </div>
                  <div className="flex items-center gap-3">
                    <div className="w-5 h-5 rounded-full bg-blue-500/20 text-blue-300 flex items-center justify-center flex-shrink-0">
                      <Icon name="shirt" className="w-3 h-3" />
                    </div>
                    <span>Select your preferred colour (Royal Blue / Classic White) and size (S - XXXL)</span>
                  </div>
                  <div className="flex items-center gap-3">
                    <div className="w-5 h-5 rounded-full bg-indigo-500/20 text-indigo-300 flex items-center justify-center flex-shrink-0">
                      <Icon name="shield-check" className="w-3 h-3" />
                    </div>
                    <span>One-time secure submission per student index number</span>
                  </div>
                </div>
              </div>

              <div className="text-[11px] sm:text-xs text-blue-200/50 pt-4 sm:pt-6 border-t border-white/10">

            {/* Right Interactive Form Area */}

                {errorMessage && (

                    <div>{errorMessage}</div>

                <form onSubmit={handleVerify} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">
                      Full Name
                    </label>
                    <input

                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">
                      Index Number
                    </label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. 0721000001"
                      value={indexNumber}
                      onChange={(e) => setIndexNumber(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50/50 hover:bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#103E8C] focus:border-transparent text-sm uppercase font-mono transition text-slate-900 placeholder:text-slate-400"
                    />
                  </div>

                  <div className="pt-2">
                    <button
                      type="submit"
                      disabled={isLoading || (settings && settings.submissionStatus === 'CLOSED')}
                      className="w-full bg-[#103E8C] hover:bg-[#0B2E68] disabled:bg-slate-300 text-white font-medium py-3.5 px-6 rounded-xl shadow-sm transition flex items-center justify-center gap-2 text-sm"
                    >
                      {isLoading ? (
                        <>
                          <Icon name="loader-2" className="w-4 h-4 animate-spin" />
                          <span>Verifying Eligibility...</span>
                        </>
                      ) : (
                        <span>Verify & Continue</span>
                      )}
                    </button>
                  </div>
                </form>

                <div className="mt-8 text-center text-xs text-slate-500 space-y-2">
                  <div>
                    Need assistance?{' '}
                    <button
                      type="button"
                      onClick={() => setShowContactModal(true)}
                      className="text-[#103E8C] font-semibold hover:underline"
                    >
                      Contact ITSU Treasurer
                    </button>
                  </div>

                  <div>
                    <button
                      type="button"
                      onClick={onOpenTreasurer}
                      className="text-[#103E8C] font-semibold hover:underline"
                    >
                      Treasurer Login
                    </button>
                  </div>
                </div>
              </div>
            </div>

            {/* Contact Treasurer Popup Modal */}
            <ContactTreasurerModal
              isOpen={showContactModal}
              onClose={() => setShowContactModal(false)}
            />

          </div>
        );
      }

      // -------------------------------------------------------------
      // 2. STEP: SELECTION (FULL-WIDTH STUDIO SHOWCASE - EXACT MATCH TO IMAGE 2)
      // -------------------------------------------------------------
      if (step === 'select') {
        return (
          <div className="flex-grow flex flex-col bg-[#FDFDFD] py-6 sm:py-8 px-4 sm:px-6 lg:px-8 min-h-screen">
            <div className="max-w-5xl mx-auto w-full flex-grow flex flex-col justify-between">

    // ==========================================
    // COMPONENT: Password Change Modal (First Login or Manual)
    // ==========================================
    function ChangePasswordModal({ isOpen, onClose, sessionToken, isForced, onPasswordChanged, onNotify }) {
      const [currentPassword, setCurrentPassword] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [confirmPassword, setConfirmPassword] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [error, setError] = useState('');

      if (!isOpen) return null;

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');

        if (newPassword.length < 8) {
          setError('New password must be at least 8 characters long.');
          return;
        }

        if (newPassword !== confirmPassword) {
          setError('New password and confirmation do not match.');
          return;
        }

        setIsLoading(true);
        try {
          const res = await ApiService.call('changeAdminPassword', sessionToken, currentPassword, newPassword);
          if (res.success) {
            onNotify({ message: 'Password updated successfully!', type: 'success' });
            onPasswordChanged();
            onClose();
          } else {
            setError(res.message || 'Failed to update password.');
          }
        } catch (err) {
          setError(err.message || 'Password update failed.');
        } finally {
          setIsLoading(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-xl border border-slate-200 shadow-2xl max-w-md w-full p-6 relative">
            {!isForced && (
              <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <Icon name="x" className="w-5 h-5" />
              </button>
            )}

            <div className="mb-4">
              <h3 className="text-base font-bold text-slate-900">
                {isForced ? 'Password Change Required' : 'Change Administrator Password'}
              </h3>
              <p className="text-xs text-slate-500 mt-0.5">
                {isForced 
                  ? 'First-time login detected. You must set a new secure password before proceeding.'
                  : 'Enter your current password and choose a new secure password.'
                }
              </p>
            </div>

            {error && (
              <div className="bg-rose-50 border border-rose-200 rounded-lg p-2.5 mb-4 text-xs text-rose-800">
                {error}
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-3">
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">Current Password</label>
                <input
                  type="password"
                  required
                  value={currentPassword}
                  onChange={(e) => setCurrentPassword(e.target.value)}
                  className="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-primary-500 focus:outline-none"
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">New Password (Min 8 chars)</label>
                <input
                  type="password"
                  required
                  value={newPassword}
                  onChange={(e) => setNewPassword(e.target.value)}
                  className="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-primary-500 focus:outline-none"
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">Confirm New Password</label>
                <input
                  type="password"
                  required
                  value={confirmPassword}
                  onChange={(e) => setConfirmPassword(e.target.value)}
                  className="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-primary-500 focus:outline-none"
                />
              </div>

              <div className="pt-2">
                <button
                  type="submit"
                  disabled={isLoading}
                  className="w-full bg-primary-800 hover:bg-primary-900 text-white font-semibold py-2.5 px-4 rounded-lg transition text-xs flex items-center justify-center gap-2"
                >
                  {isLoading ? 'Updating...' : 'Save New Password'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    function AddStudentModal({ isOpen, onClose, sessionToken, onStudentAdded, onNotify }) {
      const [fullName, setFullName] = useState('');
      const [indexNumber, setIndexNumber] = useState('');
      const [paymentRef, setPaymentRef] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [error, setError] = useState('');

      if (!isOpen) return null;

      const handleAdd = async (e) => {
        e.preventDefault();
        setError('');
        setIsLoading(true);

        try {
          const res = await ApiService.call('addPaidStudent', sessionToken, {
            fullName: fullName.trim(),
            indexNumber: indexNumber.trim(),
            paymentStatus: 'PAID',
            paymentReference: paymentRef.trim() || undefined
          });

          if (res.success) {
            onNotify({ message: 'Student added to register successfully!', type: 'success' });
            onStudentAdded();

    // ==========================================
    // COMPONENT: Correct Selection Modal
    // ==========================================
    function CorrectSelectionModal({ isOpen, onClose, student, sessionToken, onSelectionUpdated, onNotify }) {
      const [colour, setColour] = useState('Blue');
      const [size, setSize] = useState('L');
      const [reason, setReason] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [error, setError] = useState('');

      useEffect(() => {
        if (student) {
          if (student.selectedColour && student.selectedColour !== '-') setColour(student.selectedColour);
          if (student.selectedSize && student.selectedSize !== '-') setSize(student.selectedSize);
        }
      }, [student]);

      if (!isOpen || !student) return null;

      const handleUpdate = async (e) => {
        e.preventDefault();
        setError('');
        setIsLoading(true);

        try {
          const res = await ApiService.call('updateStudentSelection', sessionToken, student.indexNumber, {
            colour: colour,
            size: size,
            reason: reason || 'Treasurer Manual Correction'
          });

          if (res.success) {
            onNotify({ message: 'Selection updated successfully!', type: 'success' });
            onSelectionUpdated();
            onClose();
          } else {
            setError(res.message || 'Failed to update selection.');
          }
        } catch (err) {
          setError(err.message || 'Failed to update selection.');
        } finally {
          setIsLoading(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-xl border border-slate-200 shadow-2xl max-w-md w-full p-6 relative">
            <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
              <Icon name="x" className="w-5 h-5" />
            </button>

            <h3 className="text-base font-bold text-slate-900 mb-1">Correct Student Selection</h3>
            <p className="text-xs text-slate-500 mb-3">
              Editing for: <span className="font-semibold text-slate-800">{student.fullName}</span> ({student.indexNumber})
            </p>

            {error && (
              <div className="bg-rose-50 border border-rose-200 rounded-lg p-2.5 mb-3 text-xs text-rose-800">
                {error}
              </div>
            )}

            <form onSubmit={handleUpdate} className="space-y-3">
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">Colour</label>
                <select
                  value={colour}
                  onChange={(e) => setColour(e.target.value)}
                  className="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-primary-500 focus:outline-none"
                >
                  <option value="Blue">Blue</option>
                  <option value="White">White</option>
                </select>
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">Size</label>
                <select
                  value={size}
                  onChange={(e) => setSize(e.target.value)}
                  className="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-primary-500 focus:outline-none"
                >
                  <option value="S">S</option>
                  <option value="M">M</option>
                  <option value="L">L</option>
                  <option value="XL">XL</option>
                  <option value="XXL">XXL</option>
                  <option value="XXXL">XXXL</option>
                </select>
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">Reason for Change (Audit Log)</label>
                <input
                  type="text"
                  required
                  placeholder="e.g. Student requested size change due to fit"
                  value={reason}
                  onChange={(e) => setReason(e.target.value)}
                  className="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-primary-500 focus:outline-none"
                />
              </div>

              <div className="pt-2 flex justify-end gap-2">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-3 py-2 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  disabled={isLoading}
                  className="px-4 py-2 text-xs font-semibold text-white bg-primary-800 hover:bg-primary-900 rounded-lg flex items-center gap-1.5"
                >
                  {isLoading ? 'Updating...' : 'Save Correction'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // COMPONENT: Treasurer Dashboard
    // ==========================================
    function TreasurerDashboard({ session, onLogout, onNotify, onOpenPortal }) {
      const [activeTab, setActiveTab] = useState('overview'); // overview, students, selections, pending, analytics, reports, settings, audit
      const [sidebarOpen, setSidebarOpen] = useState(false);
      
      const [stats, setStats] = useState(null);
      const [studentRecords, setStudentRecords] = useState([]);
      const [pendingStudents, setPendingStudents] = useState([]);
      const [auditLogs, setAuditLogs] = useState([]);
      const [portalSettings, setPortalSettings] = useState(null);
      
      const [isLoading, setIsLoading] = useState(false);
      const [isStatsLoading, setIsStatsLoading] = useState(false);

      // Filters
      const [searchQuery, setSearchQuery] = useState('');
      const [filterColour, setFilterColour] = useState('ALL');
      const [filterSize, setFilterSize] = useState('ALL');
      const [filterStatus, setFilterStatus] = useState('ALL');

      // Modals
      const [showAddStudentModal, setShowAddStudentModal] = useState(false);
      const [correctModalStudent, setCorrectModalStudent] = useState(null);
      const [showPasswordChangeModal, setShowPasswordChangeModal] = useState(session && session.mustChangePassword);

      // Fetch Dashboard Stats
      const loadStats = async () => {
        setIsStatsLoading(true);
        try {
          const res = await ApiService.call('getDashboardStats', session.sessionToken);
          setStats(res);
        } catch (err) {
          onNotify({ message: 'Error loading dashboard statistics: ' + err.message, type: 'error' });
        } finally {
          setIsStatsLoading(false);
        }
      };

      // Fetch Student Records
      const loadStudentRecords = async () => {
        setIsLoading(true);
        try {
          const res = await ApiService.call('getStudentSelections', session.sessionToken, {
            search: searchQuery,
            colour: filterColour,
            size: filterSize,
            status: filterStatus
          });
          setStudentRecords(res);
        } catch (err) {
          onNotify({ message: 'Error loading student records: ' + err.message, type: 'error' });
        } finally {
          setIsLoading(false);
        }
      };

      // Fetch Pending Students
      const loadPendingStudents = async () => {
        setIsLoading(true);
        try {
          const res = await ApiService.call('getPendingStudents', session.sessionToken);
          setPendingStudents(res);
        } catch (err) {
          onNotify({ message: 'Error loading pending students: ' + err.message, type: 'error' });
        } finally {
          setIsLoading(false);
        }
      };

      // Fetch Audit Logs
      const loadAuditLogs = async () => {
        setIsLoading(true);
        try {
          const res = await ApiService.call('getAuditLogs', session.sessionToken);
          setAuditLogs(res);
        } catch (err) {
          onNotify({ message: 'Error loading audit logs: ' + err.message, type: 'error' });
        } finally {
          setIsLoading(false);
        }
      };

      // Fetch Settings
      const loadSettings = async () => {
        try {
          const res = await ApiService.call('getPortalSettings');
          setPortalSettings(res);
        } catch (err) {
          console.error(err);
        }
      };

      // Initial Data Loading
      useEffect(() => {
        loadStats();
        loadSettings();
      }, []);

      // Tab switch effect
      useEffect(() => {
        if (activeTab === 'students' || activeTab === 'selections') {
          loadStudentRecords();
        } else if (activeTab === 'pending') {
          loadPendingStudents();
        } else if (activeTab === 'audit') {
          loadAuditLogs();
        } else if (activeTab === 'overview' || activeTab === 'analytics') {
          loadStats();
        }
      }, [activeTab]);

      // Toggle Submissions Open / Closed
      const handleToggleSubmissions = async () => {
        const newStatus = (stats?.overview?.submissionStatus === 'OPEN') ? 'CLOSED' : 'OPEN';
        try {
          const res = await ApiService.call('setSubmissionStatus', session.sessionToken, newStatus);
          if (res.success) {
            onNotify({ message: `Submissions are now ${newStatus}!`, type: 'success' });
            loadStats();
            loadSettings();
          }
        } catch (err) {
          onNotify({ message: 'Failed to update submission status: ' + err.message, type: 'error' });
        }
      };

      // Reset / Delete Submission
      const handleResetSubmission = async (indexNumber) => {
        if (!confirm(`Are you sure you want to reset the submission for student ${indexNumber}? They will be able to submit again.`)) return;

        try {
          const res = await ApiService.call('deleteStudentSelection', session.sessionToken, indexNumber, 'Treasurer Reset Action');
          if (res.success) {
            onNotify({ message: 'Submission reset successfully.', type: 'success' });
            loadStudentRecords();
            loadStats();
          }
        } catch (err) {
          onNotify({ message: 'Failed to reset submission: ' + err.message, type: 'error' });
        }
      };

      // Helper to generate file downloads (CSV, Excel XML, Docx, PDF)
      const downloadFile = (filename, content, mimeType) => {
        const blob = new Blob([content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      // Export Report Action
      const handleExportReport = async (reportType, format) => {
        try {
          onNotify({ message: `Generating ${format.toUpperCase()} report...`, type: 'info' });
          const rep = await ApiService.call('exportReport', session.sessionToken, reportType, format);

          const safeTitle = rep.title.replace(/[^a-zA-Z0-9_-]/g, '_');
          const dateSlug = new Date().toISOString().split('T')[0];

          if (format === 'csv') {
            // Build CSV string with UTF-8 BOM
            let csvStr = '\uFEFF';
            csvStr += `"${rep.institution}"\r\n`;
            csvStr += `"${rep.department} - ${rep.union}"\r\n`;
            csvStr += `"${rep.title}"\r\n`;
            csvStr += `"Generated: ${rep.generatedAt}"\r\n\r\n`;
            csvStr += rep.headers.map(h => `"${h}"`).join(',') + '\r\n';
            rep.rows.forEach(r => {
              csvStr += r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',') + '\r\n';
            });
            downloadFile(`${safeTitle}_${dateSlug}.csv`, csvStr, 'text/csv;charset=utf-8;');
            onNotify({ message: 'CSV report downloaded!', type: 'success' });

          } else if (format === 'xlsx') {
            // Build Excel XML spreadsheet (Opens cleanly in Microsoft Excel)
            let xml = `<?xml version="1.0"?>

   <Font ss:Bold="1" ss:Color="#FFFFFF" ss:FontName="Calibri" ss:Size="11"/>
   <Interior ss:Color="#1E3A8A" ss:Pattern="Solid"/>
   <Borders>
    <Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#000000"/>
   </Borders>
  </Style>
  <Style ss:ID="Title">
   <Font ss:Bold="1" ss:Size="14" ss:Color="#0F172A" ss:FontName="Calibri"/>
  </Style>
  <Style ss:ID="SubTitle">
   <Font ss:Italic="1" ss:Size="10" ss:Color="#64748B" ss:FontName="Calibri"/>
  </Style>
  <Style ss:ID="Cell">
   <Font ss:FontName="Calibri" ss:Size="11"/>
   <Borders>
    <Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#E2E8F0"/>
   </Borders>
  </Style>
 </Styles>
 <Worksheet ss:Name="Report">
  <Table>
   <Row><Cell ss:StyleID="Title"><Data ss:Type="String">${rep.institution} - ${rep.department}</Data></Cell></Row>
   <Row><Cell ss:StyleID="Title"><Data ss:Type="String">${rep.title}</Data></Cell></Row>
   <Row><Cell ss:StyleID="SubTitle"><Data ss:Type="String">Generated: ${rep.generatedAt} | By: ${rep.generatedBy}</Data></Cell></Row>
   <Row></Row>
   <Row>
    ${rep.headers.map(h => `<Cell ss:StyleID="Header"><Data ss:Type="String">${h}</Data></Cell>`).join('')}
   </Row>
   ${rep.rows.map(row => `
    <Row>
      ${row.map(cell => `<Cell ss:StyleID="Cell"><Data ss:Type="String">${String(cell)}</Data></Cell>`).join('')}
    </Row>
   `).join('')}
  </Table>
 </Worksheet>
</Workbook>`;
            downloadFile(`${safeTitle}_${dateSlug}.xlsx`, xml, 'application/vnd.ms-excel');
            onNotify({ message: 'Excel workbook downloaded!', type: 'success' });

          } else if (format === 'docx') {
            // Build Microsoft Word HTML formatted document
            const docContent = `
<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
<head><title>${rep.title}</title>
<style>
  body { font-family: Arial, sans-serif; font-size: 11pt; color: #1e293b; }
  h1 { font-size: 16pt; color: #1e3a8a; margin-bottom: 2px; }
  h2 { font-size: 13pt; color: #0f172a; margin-top: 0; }

  th { background-color: #1e3a8a; color: white; border: 1px solid #1e3a8a; padding: 6px 10px; text-align: left; font-size: 10pt; }
  td { border: 1px solid #cbd5e1; padding: 6px 10px; font-size: 10pt; }
  tr:nth-child(even) { background-color: #f8fafc; }
  .summary-box { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 10px; margin-bottom: 15px; }

  <div class="meta">Generated: ${rep.generatedAt} | Authorized Treasurer: ${rep.generatedBy}</div>
  
  <div class="summary-box">
    <strong>Executive Summary:</strong><br/>
    ${Object.entries(rep.summary || {}).map(([k, v]) => `• <b>${k}:</b> ${v}<br/>`).join('')}
  </div>

  <table>
    <thead>
      <tr>${rep.headers.map(h => `<th>${h}</th>`).join('')}</tr>
    </thead>
    <tbody>
      ${rep.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}
    </tbody>
  </table>
</body>
</html>`;
            downloadFile(`${safeTitle}_${dateSlug}.docx`, docContent, 'application/vnd.ms-word');
            onNotify({ message: 'Word document downloaded!', type: 'success' });

          } else if (format === 'pdf') {
            // Create a clean printable popup / view that triggers instant PDF printing
            const printWin = window.open('', '_blank');

                                <td className="py-2.5 px-4 text-slate-500 font-mono">{st.paymentReference}</td>
                                <td className="py-2.5 px-4 text-right">
                                  <button
                                    onClick={() => setCorrectModalStudent({ ...st, selectedColour: 'Blue', selectedSize: 'L' })}
                                    className="px-2.5 py-1 text-xs font-semibold text-primary-800 bg-primary-50 hover:bg-primary-100 border border-primary-200 rounded"
                                  >
                                    Record for Student
                                  </button>
                                </td>
                              </tr>
                            ))
                          ) : (
                            <tr>
                              <td colSpan="6" className="py-8 text-center text-slate-400">
                                {isLoading ? 'Scanning register...' : 'All paid students have successfully submitted their selections!'}
                              </td>
                            </tr>
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>

                </div>
              )}

              {/* ------------------------------------
                  4. ANALYTICS TAB
                 ------------------------------------ */}
              {activeTab === 'analytics' && (
                <div className="space-y-6">
                  
                  {/* Colour Chart / Distribution */}
                  <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                    <h3 className="text-sm font-bold text-slate-900 mb-4">Colour Preference Analytics</h3>
                    
                    <div className="space-y-4">
                      {/* Blue Bar */}
                      <div>
                        <div className="flex justify-between text-xs font-semibold mb-1">
                          <span className="text-blue-700 flex items-center gap-1.5">
                            <span className="w-2.5 h-2.5 rounded-full bg-blue-700"></span>
                            Royal Blue
                          </span>
                          <span className="text-slate-900">
                            {stats?.colours?.blue?.count || 0} units ({stats?.colours?.blue?.percentage || 0}%)
                          </span>
                        </div>
                        <div className="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
                          <div 
                            className="bg-blue-700 h-3 rounded-full transition-all duration-500"
                            style={{ width: `${stats?.colours?.blue?.percentage || 0}%` }}
                          ></div>
                        </div>
                      </div>

                      {/* White Bar */}
                      <div>
                        <div className="flex justify-between text-xs font-semibold mb-1">
                          <span className="text-slate-700 flex items-center gap-1.5">
                            <span className="w-2.5 h-2.5 rounded-full bg-white border border-slate-400"></span>
                            Classic White
                          </span>
                          <span className="text-slate-900">
                            {stats?.colours?.white?.count || 0} units ({stats?.colours?.white?.percentage || 0}%)
                          </span>
                        </div>
                        <div className="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
                          <div 
                            className="bg-slate-400 h-3 rounded-full transition-all duration-500"
                            style={{ width: `${stats?.colours?.white?.percentage || 0}%` }}
                          ></div>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Size Distribution Bars */}
                  <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                    <h3 className="text-sm font-bold text-slate-900 mb-4">Size Distribution Breakdown</h3>

                    <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
                      {['S', 'M', 'L', 'XL', 'XXL', 'XXXL'].map(sz => {
                        const count = stats?.sizes?.[sz] || 0;
                        const total = stats?.overview?.totalSubmissions || 1;
                        const pct = Math.round((count / total) * 100);
                        return (
                          <div key={sz} className="bg-slate-50 border border-slate-200 rounded-lg p-3 text-center">
                            <span className="text-xs font-bold text-slate-500 block">Size {sz}</span>
                            <span className="text-xl font-extrabold text-slate-900 block my-1">{count}</span>
                            <span className="text-[10px] text-slate-400 block">{pct}% of total</span>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                </div>
              )}

              {/* ------------------------------------
                  5. REPORTS TAB
                 ------------------------------------ */}
              {activeTab === 'reports' && (
                <div className="space-y-6">
                  
                  <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                    <h3 className="text-base font-bold text-slate-900 mb-1">Official Administrative Reports</h3>
                    <p className="text-xs text-slate-500 mb-6">
                      Export university-standard reports in Excel (.xlsx), Word (.docx), PDF, or CSV.
                    </p>

                    <div className="divide-y divide-slate-100">
                      {[
                        { id: 'COMPLETE_REGISTER', title: 'Complete Student Selection Register', desc: 'Full register of all student submissions with timestamps and colours.' },
                        { id: 'BLUE_LACOSTE_LIST', title: 'Blue Lacoste Selections List', desc: 'Filtered list of all students ordering Royal Blue shirts.' },
                        { id: 'WHITE_LACOSTE_LIST', title: 'White Lacoste Selections List', desc: 'Filtered list of all students ordering Classic White shirts.' },
                        { id: 'SIZE_DISTRIBUTION', title: 'Size Distribution Report', desc: 'Quantity totals across S, M, L, XL, XXL, and XXXL.' },
                        { id: 'COLOUR_SIZE_BREAKDOWN', title: 'Colour and Size Matrix Report', desc: 'Full cross-tabulation table for garment production.' },
                        { id: 'PENDING_STUDENTS', title: 'Pending Students Register', desc: 'List of all eligible paid students who have not yet submitted.' },
                        { id: 'OVERALL_SUMMARY', title: 'Overall Collection Executive Summary', desc: 'High-level metrics summary for Departmental Board / HOD review.' },
                      ].map(rep => (
                        <div key={rep.id} className="py-4 flex flex-col md:flex-row md:items-center justify-between gap-3">
                          <div>
                            <h4 className="text-sm font-bold text-slate-900">{rep.title}</h4>
                            <p className="text-xs text-slate-500 mt-0.5">{rep.desc}</p>
                          </div>

                          {/* Format Buttons */}
                          <div className="flex items-center gap-1.5">
                            <button
                              onClick={() => handleExportReport(rep.id, 'xlsx')}
                              className="px-2.5 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-200 rounded-md text-xs font-semibold flex items-center gap-1 transition"
                            >
                              <Icon name="file-spreadsheet" className="w-3.5 h-3.5" />
                              <span>Excel</span>
                            </button>

                            <button
                              onClick={() => handleExportReport(rep.id, 'docx')}
                              className="px-2.5 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-800 border border-blue-200 rounded-md text-xs font-semibold flex items-center gap-1 transition"
                            >
                              <Icon name="file-text" className="w-3.5 h-3.5" />
                              <span>Word</span>
                            </button>

                            <button
                              onClick={() => handleExportReport(rep.id, 'pdf')}
                              className="px-2.5 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-800 border border-rose-200 rounded-md text-xs font-semibold flex items-center gap-1 transition"
                            >
                              <Icon name="printer" className="w-3.5 h-3.5" />
                              <span>PDF</span>
                            </button>

                            <button
                              onClick={() => handleExportReport(rep.id, 'csv')}
                              className="px-2.5 py-1.5 bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200 rounded-md text-xs font-semibold flex items-center gap-1 transition"
                            >
                              <Icon name="download" className="w-3.5 h-3.5" />
                              <span>CSV</span>
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>

                  </div>

                </div>
              )}

              {/* ------------------------------------
                  6. SETTINGS TAB
                 ------------------------------------ */}
              {activeTab === 'settings' && (
                <div className="space-y-6">
                  
                  <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
                    <h3 className="text-base font-bold text-slate-900">Portal Configuration</h3>
                    
                    <div className="space-y-4 text-xs sm:text-sm">
                      <div className="flex items-center justify-between py-2 border-b border-slate-100">
                        <div>
                          <span className="font-semibold text-slate-800 block">Submissions Status</span>
                          <span className="text-slate-500 text-xs">Allow or restrict student submissions</span>
                        </div>
                        <button
                          onClick={handleToggleSubmissions}
                          className={`px-3 py-1.5 rounded-lg font-bold text-xs ${
                            stats?.overview?.submissionStatus === 'OPEN'
                              ? 'bg-emerald-100 text-emerald-800'
                              : 'bg-rose-100 text-rose-800'
                          }`}
                        >
                          {stats?.overview?.submissionStatus === 'OPEN' ? 'OPEN' : 'CLOSED'}
                        </button>
                      </div>

                      <div className="flex items-center justify-between py-2 border-b border-slate-100">
                        <div>
                          <span className="font-semibold text-slate-800 block">Available Colours</span>
                          <span className="text-slate-500 text-xs">Configured garment colour variants</span>
                        </div>
                        <span className="font-mono text-slate-700">Blue, White</span>
                      </div>

                      <div className="flex items-center justify-between py-2 border-b border-slate-100">
                        <div>
                          <span className="font-semibold text-slate-800 block">Available Sizes</span>
                          <span className="text-slate-500 text-xs">Standard sizes accepted</span>
                        </div>
                        <span className="font-mono text-slate-700">S, M, L, XL, XXL, XXXL</span>
                      </div>

                      <div className="flex items-center justify-between py-2 border-b border-slate-100">
                        <div>
                          <span className="font-semibold text-slate-800 block">Max Submissions Per Student</span>
                          <span className="text-slate-500 text-xs">Strict duplicate protection</span>
                        </div>
                        <span className="font-mono font-bold text-slate-700">1</span>
                      </div>

                      <div className="pt-2">
                        <button
                          onClick={() => setShowPasswordChangeModal(true)}
                          className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-semibold rounded-lg transition"
                        >
                          Update Administrator Password
                        </button>
                      </div>
                    </div>

                  </div>

                </div>
              )}

              {/* ------------------------------------
                  7. AUDIT LOGS TAB
                 ------------------------------------ */}
              {activeTab === 'audit' && (
                <div className="space-y-4">
                  
                  <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                    <div className="p-4 border-b border-slate-100 flex items-center justify-between">
                      <div>
                        <h3 className="text-sm font-bold text-slate-900">System Audit Trail</h3>
                        <p className="text-xs text-slate-500 mt-0.5">Immutable record of security events, edits, and exports</p>
                      </div>
                      <button
                        onClick={loadAuditLogs}
                        className="text-xs font-medium text-slate-600 hover:text-slate-900 bg-slate-100 px-3 py-1.5 rounded-lg"
                      >
                        Refresh Logs
                      </button>
                    </div>

                    <div className="overflow-x-auto">
                      <table className="w-full text-left border-collapse text-xs">
                        <thead>
                          <tr className="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold uppercase tracking-wider text-[10px]">
                            <th className="py-2.5 px-4">Log ID</th>
                            <th className="py-2.5 px-4">Timestamp (GMT)</th>
                            <th className="py-2.5 px-4">Actor</th>
                            <th className="py-2.5 px-4">Action</th>
                            <th className="py-2.5 px-4">Details</th>
                            <th className="py-2.5 px-4 text-right">Status</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100 font-mono text-[11px]">
                          {auditLogs.length > 0 ? (
                            auditLogs.map((log, idx) => (
                              <tr key={idx} className="hover:bg-slate-50/50">
                                <td className="py-2.5 px-4 text-slate-400">{log.logId}</td>
                                <td className="py-2.5 px-4 text-slate-600">{log.timestamp}</td>
                                <td className="py-2.5 px-4 font-semibold text-slate-900">{log.user}</td>
                                <td className="py-2.5 px-4 font-semibold text-primary-800">{log.action}</td>
                                <td className="py-2.5 px-4 text-slate-600 max-w-xs truncate" title={log.details}>{log.details}</td>
                                <td className="py-2.5 px-4 text-right">
                                  <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                    log.status === 'SUCCESS' ? 'bg-emerald-100 text-emerald-800' :
                                    log.status === 'WARNING' ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-700'
                                  }`}>
                                    {log.status}
                                  </span>
                                </td>
                              </tr>
                            ))
                          ) : (
                            <tr>
                              <td colSpan="6" className="py-8 text-center text-slate-400 font-sans">
                                {isLoading ? 'Loading audit records...' : 'No audit records found.'}
                              </td>
                            </tr>
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>

                </div>
              )}

            </div>

          </main>

          {/* Modals */}
          <AddStudentModal
            isOpen={showAddStudentModal}
            onClose={() => setShowAddStudentModal(false)}
            sessionToken={session.sessionToken}
            onStudentAdded={() => { loadStudentRecords(); loadStats(); }}
            onNotify={onNotify}
          />

          <CorrectSelectionModal
            isOpen={!!correctModalStudent}
            student={correctModalStudent}
            onClose={() => setCorrectModalStudent(null)}
            sessionToken={session.sessionToken}
            onSelectionUpdated={() => { loadStudentRecords(); loadStats(); }}
            onNotify={onNotify}
          />

          <ChangePasswordModal
            isOpen={showPasswordChangeModal}
            onClose={() => setShowPasswordChangeModal(false)}
            sessionToken={session.sessionToken}
            isForced={session?.mustChangePassword}
            onPasswordChanged={() => { session.mustChangePassword = false; }}
            onNotify={onNotify}
          />

        </div>
      );
    }

    // ==========================================
    // MAIN APP CONTROLLER
    // ==========================================
    function App() {
      const [view, setView] = useState('portal'); // 'portal' | 'treasurer'
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [treasurerSession, setTreasurerSession] = useState(() => {
        try {
          const saved = localStorage.getItem(SESSION_STORAGE_KEY);
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });
      const [settings, setSettings] = useState(null);
      const [toast, setToast] = useState(null);

      // Load initial settings
      useEffect(() => {
        ApiService.call('getPortalSettings')
          .then(res => setSettings(res))
          .catch(err => console.warn('Could not fetch portal settings:', err));
      }, []);

      const showNotification = (notification) => {
        setToast(notification);
        setTimeout(() => setToast(null), 4000);
      };

      const handleLoginSuccess = (sessionData) => {
        setTreasurerSession(sessionData);
        try {
          localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(sessionData));
        } catch (e) {}
        setView('treasurer');
        showNotification({ message: 'Welcome back, Treasurer!', type: 'success' });
      };

      const handleLogout = async () => {
        if (treasurerSession?.sessionToken) {
          try {
            await ApiService.call('adminLogout', treasurerSession.sessionToken);
          } catch (e) {}
        }
        setTreasurerSession(null);
        try {
          localStorage.removeItem(SESSION_STORAGE_KEY);
        } catch (e) {}
        setView('portal');
        showNotification({ message: 'Logged out successfully.', type: 'info' });
      };

      const handleOpenTreasurer = () => {
        if (treasurerSession) {
          setView('treasurer');
        } else {
          setShowLoginModal(true);
        }
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 font-sans">
          
          {/* Header */}
          {/* Active View */}
          {view === 'treasurer' && treasurerSession ? (
            <TreasurerDashboard
              onOpenPortal={() => setView('portal')}
              session={treasurerSession}
              onLogout={handleLogout}
              onNotify={showNotification}
            />
          ) : (
            <StudentPortal
              onOpenTreasurer={handleOpenTreasurer}
              settings={settings}
              onNotify={showNotification}
            />
          )}

          {/* Footer */}
          {/* Treasurer Login Modal */}
          <TreasurerLoginModal
            isOpen={showLoginModal}
            onClose={() => setShowLoginModal(false)}
            onLoginSuccess={handleLoginSuccess}
            onNotify={showNotification}
          />

          {/* Toast Container */}
          <Toast toast={toast} onClose={() => setToast(null)} />

        </div>
      );
    }

    // Render the React application
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
